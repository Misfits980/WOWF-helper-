<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<style>:root{--bg:#0e1016;--panel:#161922;--panel2:#1d212c;--line:#2a2f3d;--txt:#e9e6dc;--mute:#9097a6;--gold:#dbb45c;--good:#6fd18d;--bad:#ee7b7b;--warn:#e8b45a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}

button,input,select,textarea{font:inherit;color:inherit}
button{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 14px;min-height:44px;cursor:pointer}

.sub{font-size:12px;color:var(--mute)}
.step{display:flex;align-items:center;gap:6px}

.main{padding:4px 14px 16px;max-width:720px;margin:0 auto}

.st{display:flex;flex-wrap:wrap;gap:4px;margin-top:2px}

.hint{font-size:12px}.hint.mute{color:var(--mute)}.hint.ok{color:var(--mute)}
.sn{display:none}
.sv,.gv{font-weight:800;font-family:'Nanum Myeongjo',serif;min-width:40px;text-align:right}
.ic{width:44px;height:44px;border-radius:8px;border:2px solid var(--line);flex:none;object-fit:cover;background:var(--panel2)}

.filters{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}

.sr{display:block;font-size:0}.sr input{font-size:15px}
.fchips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}

.chk{display:flex;gap:8px;align-items:center;font-size:14px}.chk input{width:20px;height:20px;accent-color:var(--gold)}

.wgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.wr{display:flex;flex-direction:column;gap:2px;font-size:13px;color:var(--mute)}
.f label{display:block;font-size:13px;color:var(--mute);margin:8px 0}
.row2{display:grid;grid-template-columns:1.4fr 1fr;gap:8px}.stats4{display:grid;grid-template-columns:1fr 1fr;gap:0 8px}

.foot{font-size:12px;color:var(--mute);margin:16px 0}

.sheet{background:var(--bg);width:100%;max-width:720px;max-height:92vh;overflow-y:auto;border-radius:18px 18px 0 0;border:1px solid var(--line);padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.shead{position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;align-items:center;padding:8px 10px;background:var(--bg);border-bottom:1px solid var(--line)}
.stitle{font-weight:800}
.sbody{padding:6px 14px}
.ihead{display:flex;gap:12px;align-items:center;margin:8px 0}
.score{display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:8px;margin:8px 0}

.stt{width:100%;border-collapse:collapse;font-size:14px;margin:8px 0}.stt th,.stt td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:right}.stt th:first-child{text-align:left;font-weight:400;color:var(--mute)}.stt thead th{font-size:12px;color:var(--mute)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:4px 0}.kv dt{color:var(--mute)}.kv dd{margin:0}
.links{margin:6px 0}
.sticky{position:sticky;bottom:0;background:var(--bg);padding:10px 0}
.ic.ph{font-size:22px;border-style:solid}.korow{display:flex;gap:8px}.korow input{flex:1;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px;min-height:44px}

.lvb{flex:none;min-width:52px;text-align:center;font-weight:800;color:#1a1405;background:var(--gold);border-radius:8px;padding:2px 6px;height:fit-content;font-size:13px}

.dsc{font-size:14px;margin:2px 0}.srcs{font-size:11px;color:var(--mute);margin-top:2px}.srcs::before{content:'출처 '}
.panel.tight{padding:4px 12px 12px;margin:10px 0}.panel.tight h3{margin-top:10px}
.qrow{display:flex;gap:10px;align-items:flex-start;padding:8px 4px;border-bottom:1px solid var(--line);cursor:pointer}.qrow input{width:22px;height:22px;margin-top:2px;accent-color:var(--gold);flex:none}.qrow.done .nm{text-decoration:line-through;color:var(--mute)}
.cmp{width:100%;border-collapse:collapse;font-size:13px}.cmp th,.cmp td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}.cmp th{color:var(--mute);font-weight:400}.cmp td:nth-child(n+2){white-space:nowrap}.okrow td{background:#221d10}.okrow b{color:var(--gold)}
.zrow{display:flex;justify-content:space-between;gap:10px;padding:6px 2px;border-bottom:1px solid var(--line);font-size:14px}.zrow b{color:var(--gold);white-space:nowrap}
.qlv{flex:none;min-width:44px;font-size:12px;color:var(--gold);font-weight:700;margin-top:3px}.qrow.gray .nm{color:var(--mute)}.qrow.gray{opacity:.6}
.icrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:6px 0}.filebtn{display:inline-flex;align-items:center;min-height:44px;padding:0 14px;border:1px solid var(--gold);color:var(--gold);border-radius:10px;cursor:pointer}.filebtn input{display:none}
#cropc{display:block;border-radius:8px;margin:8px 0;touch-action:manipulation}#cropsz{width:100%}
.step2.done{opacity:.55}.profin label{display:flex;align-items:center;gap:10px;font-size:14px}.profin input{width:110px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px;min-height:44px}
.tabs button{font-size:12px;padding:6px 0;letter-spacing:-.3px}

button.lrow{width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer}.lvb.n{min-width:30px}.lvb.blank{visibility:hidden}.sv.up{color:var(--good,#7fc77f)}

.okbox{background:rgba(111,209,141,.1);border:1px solid rgba(111,209,141,.4);border-radius:10px;padding:10px 12px;margin:8px 0}
.lghead{display:flex;justify-content:space-between;align-items:flex-end;gap:8px}.lghead h2,.lghead h3{margin:0}
.lgstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}

.f h3{margin:12px 0 4px;font-size:15px;color:var(--gold)}
.main a{color:var(--gold)}

.k-a{color:#9fd0ff}.k-q{color:#ffd76a}.k-t{color:#d9a6ff}.k-z{color:#8fe0a0}.k-d{color:#ff9f7a}.k-p{color:#f0c890}.k-e{color:var(--gold)}.k-m{color:#fff}.k-g{color:var(--mute)}

.arow{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)}.arow:first-child{border-top:0}.arow .m{flex:1;min-width:0}.arow.lock{opacity:.45}

.cnm{display:inline-block;font-size:13px;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:1px 8px;color:var(--txt);vertical-align:middle}

.qch{display:flex;flex-wrap:wrap;gap:4px;margin:3px 0}
.chip.lk{border-color:#2f5a8a;color:#8cc4ff}

/* 문자열(슬롯 종류) 또는 아이템을 받아 끼울 수 있는 칸 목록 */
function itemSlots(x){
  if(typeof x==='string')return POOL_SLOTS[x]||[x];
  if(!x)return [];
  if(x.sl==='weapon'&&x.ty!=='2h'&&!x.mh&&SPEC_NOW&&SPEC_NOW.dw)return ['weapon','offhand'];

function sc(it,w,S){
  if(!it||!it.s)return 0;let a=0;const sp=SPEC_NOW||{};
  for(const k in w){
    if(k==='dpsoh')continue;
    if(k==='dps'){
      if(!it.dps||it.sl==='wand')continue;
      if(S==='offhand'&&(it.sl==='weapon'||it.oh)){a+=it.dps*(w.dpsoh||0);continue}
      let f=1;
      if(it.sl==='weapon'&&sp.mhPref&&!sp.mhPref.includes(it.wt))f=.6;
      if(it.sl==='weapon'&&sp.pref2h&&it.ty!=='2h')f=.7;
      a+=it.dps*w.dps*f;continue;
    }
    a+=(it.s[k]||0)*(w[k]||0);
  }
  return a;
}
/* 칸을 알고 계산 (보조 손 무기는 보조 손 가중치) */
function scSlot(it,w,S){return sc(it,w,S)}
function allItems(st){return ITEMS.filter(i=>canUse(i,SPEC_NOW,99)).concat(st.custom||[])}
function getItem(st,id){return id?(ITEMS.find(i=>i.id===id)||(st.custom||[]).find(i=>i.id===id)||null):null}
function eqSet(st){return new Set(Object.values(st.eq).filter(Boolean))}

/* 레벨 L에서 가능한 최선의 장비 조합. 반지·장신구는 둘이 겹치지 않게, 무기는 양손/한손+보조 장비를 비교 */
function plan(st,L){
  const A=allItems(st),w=st.w,E=eqSet(st);
  /* 일반 몹에서 낮은 확률로 떨어지는 장비는 가방에 있을 때만 추천해요 */
  const ok=i=>i.s&&((i.lv<=L&&canUse(i,SPEC_NOW,L)&&(i.kd!=='trash'||st.got[i.id]))||E.has(i.id));
  const rec={};
  for(const S of SINGLE){
    const cur=getItem(st,st.eq[S]);
    let best=cur,bs=cur?sc(cur,w):-1;
    for(const i of A){if(i.sl===S&&ok(i)&&sc(i,w)>bs+1e-9){best=i;bs=sc(i,w)}}
    rec[S]=best;
  }
  for(const P of Object.keys(POOL_SLOTS)){
    const slots=POOL_SLOTS[P];
    const top=A.filter(i=>i.sl===P&&ok(i)).sort((a,b)=>sc(b,w)-sc(a,w)).slice(0,2);
    const used=new Set();
    slots.forEach(s=>{const e=st.eq[s];if(e&&top.some(t=>t.id===e)){rec[s]=getItem(st,e);used.add(e)}});
    slots.forEach(s=>{if(!rec[s]){const n=top.find(t=>!used.has(t.id));rec[s]=n||null;if(n)used.add(n.id)}});
  }
  const weps=A.filter(i=>i.sl==='weapon'&&ok(i)).sort((a,b)=>(b.id===st.eq.weapon)-(a.id===st.eq.weapon));
  const offs=A.filter(i=>itemSlots(i).includes('offhand')&&ok(i));
  let bw=null,bof=null,bt=-1;
  for(const x of weps){
    let t=sc(x,w),o=null;
    if(x.ty!=='2h'){
      let bs=0;for(const c of offs){if(c.id===x.id)continue;const v=scSlot(c,w,'offhand');if(v>bs+1e-9){bs=v;o=c}}
      t+=bs;
    }
    if(t>bt+1e-9){bt=t;bw=x;bof=o}
  }
  if(!bw){let bs=0;for(const c of offs){const v=scSlot(c,w,'offhand');if(v>bs){bs=v;bof=c}}}
  rec.weapon=bw;rec.offhand=bof;
  const total=Object.keys(rec).reduce((a,S)=>a+scSlot(rec[S],w,S),0);
  return {rec,total};
}
/* 이 아이템을 얻으면 지금 장비보다 몇 점 오르는가 */
function gainOf(st,it){
  const w=st.w,sl=itemSlots(it);
  const cs=S=>scSlot(getItem(st,st.eq[S]),w,S);
  if(it.sl==='weapon'&&it.ty==='2h') return sc(it,w)-cs('weapon')-cs('offhand');
  if(it.sl==='weapon'){
    const main=getItem(st,st.eq.weapon);
    let g=sc(it,w)-cs('weapon')-(main&&main.ty==='2h'?0:0);
    if(sl.includes('offhand'))g=Math.max(g,scSlot(it,w,'offhand')-cs('offhand'));
    return g;
  }
  const cur=sl.map(S=>cs(S));
  return scSlot(it,w,sl[0])-Math.min(...cur);
}
/* 던전별 정리: 지금 레벨에서 얻을 수 있는 이득, 이후 이득 */
function routeInfo(st){
  const E=eqSet(st);
  const res=[];
  for(const d of DUNGEONS){
    const its=allItems(st).filter(i=>i.dg===d.id&&i.s&&!E.has(i.id)).map(i=>({it:i,g:gainOf(st,i)}));
    const ups=its.filter(x=>x.g>1e-9).sort((a,b)=>b.g-a.g);
    const best=(list)=>{
      const seen={};let sum=0;
      for(const x of list){
        const k=x.it.sl,cap=POOL_SLOTS[k]?2:1;
        seen[k]=(seen[k]||0);
        if(seen[k]<cap){seen[k]++;sum+=x.g}
      }
      return sum;
    };
    res.push({d,ups,rest:its.filter(x=>x.g<=1e-9),now:best(ups.filter(x=>x.it.lv<=st.lv)),all:best(ups)});
  }
  return res.filter(r=>r.ups.length||r.rest.length).sort((a,b)=>(b.now-a.now)||(b.all-a.all));
}

function qHub(zone,q){
  if(!q.g)return ['현상금·필드에서 시작',99];
  if(q.g.includes(' · '))return ['다른 지역에서 받기 ('+q.g.split(' · ')[0]+')',98];
  const H=QHUB[zone];if(!H||!q.xy)return ['기타',97];
  const [x,y]=q.xy.split(',').map(Number);let best=null,bd=1e9;
  H.forEach((h,i)=>{const d=Math.hypot(h[1]-x,h[2]-y);if(d<bd){bd=d;best=[h[0],i]}});

function switchSpec(id){

  const prev=SPEC[st.spec],same=prev&&prev.cls===SPEC[id].cls,keepEq=st.eq,keepGot=st.got;
  st.spec=id;const b=st.by[id];
  if(b){st.eq=b.eq;st.got=b.got;st.w=b.w;st.preset=b.preset}
  else{st.eq=blankEq();st.got={};st.w=id==='disc'?Object.assign({},PRESETS.tavern.w):Object.assign({},SPEC[id].w);st.preset=id==='disc'?'tavern':'spec'}
  /* 같은 직업 안에서 특성만 바꾸면 같은 캐릭터라 장비·가방은 그대로 */

function diffTxt(a,b){

function upRow(x,n){return '<button class="lrow" data-act="slot" data-s="'+x.S+'"><span class="lvb n">'+(n+1)+'</span>'+ico(x.r)+'<span class="m"><span class="src">'+SLOT_NAME[x.S]+(x.set?' · 세트 조각 교체':'')+'</span>'+nmHtml(x.r)+'<span class="dif">'+diffTxt(x.r,eqOf(x.S))+'</span><span class="src">'+srcLine(x.r)+(st.got[x.r.id]?' · 가방에 있음':'')+'</span>'+(x.lost?'<span class="src dn">이걸 바꾸면 세트 효과(지능 +10)가 사라져요</span>':'')+(x.hold?'<span class="src">세트를 지키려면 지금은 보류</span>':'')+'</span><span class="sv">'+gtag(x.hold?0:x.g,scSlot(eqOf(x.S),st.w,x.S))+'</span></button>'}

function upgradePlan(P0){
  const w=st.w,E=eqSet(st);
  const now=[];
  for(const [S] of SLOTS){
    const r=P0.rec[S],it=eqOf(S);
    if(r&&(!it||r.id!==it.id)){const g=scSlot(r,w,S)-scSlot(it,w,S);if(g>1e-9)now.push({S,r,g,set:it&&it.set})}
  }
  now.sort((a,b)=>b.g-a.g);
  const setN=SLOTS.filter(([S])=>{const i=eqOf(S);return i&&i.set}).length;
  /* 부패치유사 세트: 3세트 지능 +10, 4세트 마나 회복 효과. 몇 개까지 바꾸는 게 이득인지 계산 */
  const SET3=sc({s:{int:10}},w);
  const setRows=now.filter(x=>x.set);
  let bestK=0,bestV=0;
  for(let k=1;k<=setRows.length;k++){const v=setRows.slice(0,k).reduce((a,x)=>a+x.g,0)-((setN>=3&&setN-k<3)?SET3:0);if(v>bestV+1e-9){bestV=v;bestK=k}}
  setRows.forEach((x,i)=>{x.hold=i>=bestK;if(setN>=3&&setN-(i+1)===2)x.lost=SET3});
  const setLose=bestK;
  let h='<section class="panel"><h2>지금 바꿀 순서</h2>';
  if(!now.length)h+='<p class="note">레벨 '+st.lv+'에서 더 좋은 후보가 없어요. 아래 레벨별 목록을 보세요.</p>';
  else{
    h+='<p class="note">많이 좋아지는 부위부터예요. 초록 글자는 오르는 스탯, 빨간 글자는 내려가는 스탯이에요. 누르면 후보를 비교할 수 있어요.</p><div class="list">'
     +now.slice(0,6).map((x,n)=>upRow(x,n)).join('')+'</div>'+(now.length>6?'<details class="more"><summary>나머지 '+(now.length-6)+'개 더 보기</summary><div class="list">'+now.slice(6).map((x,n)=>upRow(x,n+6)).join('')+'</div></details>':'');
    if(setRows.length)h+='<p class="note">부패치유사 세트 효과: 3세트 지능 +10, 4세트 마나가 15% 밑으로 떨어지면 10초 동안 마나 200 회복(5분에 한 번). 세트 조각은 <b>'+bestK+'개</b>만 바꾸는 게 가장 이득이에요('+setN+'/5 → '+(setN-bestK)+'/5). 4세트 마나 효과는 점수에 안 넣었어요.</p>';
  }
  const rows=[];
  for(let L=st.lv+1;L<=Math.min(60,st.lv+12);L++){
    const P=plan(st,L),prev=plan(st,L-1);

      if(r&&r.lv===L&&(!p||p.id!==r.id)&&!E.has(r.id)){const g=scSlot(r,w,S)-scSlot(p,w,S);if(g>1e-9&&!got.some(x=>x.r.id===r.id))got.push({S,r,g})}
    }
    if(got.length)rows.push({L,got});
  }
  h+='</section><details class="more panel"><summary>앞으로 레벨이 오르면 낄 장비 (12레벨 안)</summary>';
  if(!rows.length)h+='<p class="note">앞으로 12레벨 안에 새로 열리는 후보가 없어요.</p>';
  else h+='<p class="note">앞으로 12레벨 동안, 그 레벨이 되면 바로 위 순서보다 더 좋아지는 장비예요.</p><div class="list">'
    +rows.map(R=>R.got.map((x,k)=>'<button class="lrow" data-act="slot" data-s="'+x.S+'"><span class="lvb n'+(k?' blank':'')+'">'+(k?'':R.L)+'</span>'+ico(x.r)+'<span class="m"><span class="src">'+SLOT_NAME[x.S]+'</span>'+nmHtml(x.r)+'<span class="dif">'+diffTxt(x.r,eqOf(x.S))+'</span><span class="src">'+srcLine(x.r)+'</span></span><span class="sv">'+gtag(x.g)+'</span></button>').join('')).join('')+'</div>';
  return h+'</details>';
}

const dgMin=d=>{const m=(d.range||'').match(/(\d+)/);return m?+m[1]:99};
const PKIND={a:['기술','k-a'],q:['직업 퀘스트','k-q'],t:['특성','k-t'],g:['팁','k-g'],z:['지역','k-z'],d:['던전','k-d'],p:['전문기술','k-p'],e:['장비','k-e'],m:['탈것','k-m']};
const TREE={rogue_assa:'암살',rogue_combat:'전투',rogue_sub:'잠행',war_arms:'무기',war_fury:'분노',war_tank:'방어',mage_arcane:'비전',mage_fire:'화염',mage_frost:'냉기',dru_bear:'야성',dru_cat:'야성',dru_bal:'조화',dru_resto:'회복',sha_ele:'정기',sha_enh:'고양',sha_resto:'복원',pri_holy:'신성',pri_shadow:'암흑',disc:'수양'};
const TREES=new Set(Object.values(TREE));
/* "암살 A / 전투 B / 잠행 C" 같은 특성 줄에서 내 특성 부분만 남겨요 */
function treeOnly(txt,id){
  let pre='',body=txt;const m=txt.match(/^(특성 시작: )/);if(m){pre=m[1];body=txt.slice(pre.length)}
  const seg=body.split(' / '),w=x=>x.trim().split(/[ :]/)[0];
  if(!seg.every(x=>TREES.has(w(x))))return txt;
  const mine=seg.filter(x=>w(x)===TREE[id]);
  return mine.length?pre+mine.join(' / ').replace(/^([^ :]+):? /,'$1: '):'';
}
function planRows(Lv,P,prev,w){
  const sp=SPEC_NOW,out=[];
  if(sp.cls==='사제'){SPELLS.filter(x=>x[0]===Lv).forEach(x=>out.push(['a',(x[2]||x[1])+(x[3]==='quest'?' (직업 퀘스트)':x[3]==='talent'?' (특성)':''),'']))}
  else (CLASS_LV[sp.cls]||[]).filter(x=>x[0]===Lv&&(!x[3]||x[3].includes(sp.id))).forEach(x=>{const t=x[1]==='t'?treeOnly(x[2],sp.id):x[2];if(t)out.push([x[1],t,''])});
  if(Lv===10)out.push(['t','특성 포인트 시작 (이후 레벨마다 1개)','']);
  STEPS.filter(S=>S.a===Lv).forEach(S=>out.push(['z',S.t,S.hub?'거점: '+S.hub:'']));
  DUNGEONS.filter(d=>d.range&&dgMin(d)===Lv).forEach(d=>out.push(['d',d.ko+' 갈 만해요',d.ko!==d.en?d.en+' · 권장 '+d.range:'권장 '+d.range]));
  PROF_RANK.forEach(r=>{const n=+r[3].match(/\d+/)[0];if(n===Lv)out.push(['p',r[0]+' 등급 배울 수 있어요 (최대 '+r[2]+')',r[3]])});
  if(Lv===40)out.push(['m','첫 탈것 · 이중 특성','']);if(Lv===60)out.push(['m','빠른 탈것','']);
  if(P&&prev){const seen={};for(const [S] of SLOTS){const r=P.rec[S],p=prev.rec[S];
    if(r&&r.lv===Lv&&(!p||p.id!==r.id)&&!seen[r.id]){const g=scSlot(r,w,S)-scSlot(p,w,S);if(g>1e-9){seen[r.id]=1;out.push(['e',dn(r)+' ('+SLOT_NAME[S].replace(/ \d/,'')+')',srcLine(r).replace(/<[^>]*>/g,''),g,r,S,scSlot(p,w,S)])}}}}
  return out;
}

  }
  if(!all&&b<60)h+='<p class="linkp"><button class="sm" data-act="planall" data-k="1">60까지 전부 보기</button></p>';
  const src=CLASS_LV_SRC[sp.cls];

/* 아이콘 자르기 */
let crop=null;
function openCrop(file,id){
  const fr=new FileReader();
  fr.onload=()=>{const im=new Image();im.onload=()=>{crop={im,id,cx:im.width/2,cy:im.height/2,sz:Math.round(Math.min(im.width,im.height)/6)};drawCrop()};im.src=fr.result};
  fr.readAsDataURL(file);
}
function drawCrop(){
  let ov=document.getElementById('cropov');
  if(!ov){ov=document.createElement('div');ov.id='cropov';ov.className='ov';ov.innerHTML='<div class="sheet"><div class="shead"><button class="sm" id="cropx">취소</button><span class="stitle">아이콘 부분을 누르세요</span><button class="sm pri" id="cropok">저장</button></div><div class="sbody"><canvas id="cropc"></canvas><label class="note">크기 <input id="cropsz" type="range" min="12" max="400"></label><div class="icrow"><canvas id="cropp" width="56" height="56" class="ic big"></canvas><span class="note">미리보기</span></div></div></div>';document.body.appendChild(ov);
    const c=ov.querySelector('#cropc');
    c.addEventListener('click',e=>{const r=c.getBoundingClientRect(),k=crop.im.width/r.width;crop.cx=(e.clientX-r.left)*k;crop.cy=(e.clientY-r.top)*k;drawCrop()});
    ov.querySelector('#cropsz').addEventListener('input',e=>{crop.sz=+e.target.value;drawCrop()});
    ov.querySelector('#cropx').addEventListener('click',()=>{ov.remove();crop=null});
    ov.querySelector('#cropok').addEventListener('click',()=>{const p=ov.querySelector('#cropp');st.ic=st.ic||{};st.ic[crop.id]=p.toDataURL('image/jpeg',.85);save();ov.remove();crop=null;render()});
  }
  const c=ov.querySelector('#cropc'),im=crop.im,W=Math.min(im.width,1200),sc2=W/im.width;
  c.width=W;c.height=Math.round(im.height*sc2);c.style.width='100%';
  const x=c.getContext('2d');x.drawImage(im,0,0,c.width,c.height);
  const s=crop.sz,l=crop.cx-s/2,t=crop.cy-s/2;
  x.strokeStyle='#dbb45c';x.lineWidth=Math.max(2,3/sc2*sc2);x.strokeRect(l*sc2,t*sc2,s*sc2,s*sc2);
  const sl=ov.querySelector('#cropsz');sl.max=Math.min(im.width,im.height);sl.value=s;
  const p=ov.querySelector('#cropp').getContext('2d');p.clearRect(0,0,56,56);p.drawImage(im,l,t,s,s,0,0,56,56);
}

function lgDate(ms){
  const d=new Date(ms),now=new Date(),day=['일','월','화','수','목','금','토'][d.getDay()];
  const hm=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
  const diff=Math.floor((new Date(now.getFullYear(),now.getMonth(),now.getDate())-new Date(d.getFullYear(),d.getMonth(),d.getDate()))/864e5);
  if(diff===0)return '오늘 '+hm;if(diff===1)return '어제 '+hm;
  return (d.getMonth()+1)+'/'+d.getDate()+' ('+day+') '+hm;
}

let LG_WID=null;
function lgMatch(x){
  if(!LG_WID){LG_WID={};ITEMS.forEach(i=>{if(i.wid)LG_WID[i.wid]=i.id})}
  if(x&&x.id&&LG_WID[x.id])return LG_WID[x.id];
  const n=String((x&&x.n)||x||'').trim().toLowerCase();if(!n)return null;
  const it=allItems(st).find(i=>i.kd!=='eq'&&((i.nm||'').toLowerCase()===n||(i.en||'').toLowerCase()===n||((st.ko||{})[i.id]||'').toLowerCase()===n));
  return it?it.id:null;
}

/* ---- 저장: 이 기기(localStorage) + 가능하면 db로 기기끼리 동기화 ---- */
let LGDB=null,lgDbState='off',lgQ=Promise.resolve();
function lgPut(k,obj){st.log[k][obj.id]=obj;lgWrite(k,obj.id,obj)}
function lgDel(k,id){delete st.log[k][id];lgWrite(k,id,null)}
function lgSafeRender(){
  const a=document.activeElement;
  if(ui.tab==='log'&&a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))return;
  render();
}
/* 최신 기록의 레벨이 더 높으면 위쪽 레벨도 올려요 */
function lgApplyLevel(force){
  const s=lgSnaps().find(x=>x.lv);if(!s)return false;
  if(force?s.lv!==st.lv:s.lv>st.lv){st.lv=Math.max(1,Math.min(60,s.lv));return true}
  return false;
}
/* 사람마다 자기 기록만 보도록 data/users/<내 id> 아래에 저장해요 (s…=능력치, r…=던전) */
let LGCOL=null;
function lgWrite(k,id,obj){
  if(!LGCOL)return;
  lgQ=lgQ.then(()=>obj?LGCOL.doc(id).set(obj):LGCOL.doc(id).delete()).catch(e=>{
    if(e&&e.code==='quota_exceeded')ui.lgmsg='저장 공간이 꽉 찼어요. 오래된 던전 기록을 지워 주세요.';
    else if(e&&(e.code==='invalid_argument'||e.code==='revoked')){lgDbState='ro';LGCOL=null}
  });
}
(async function lgDbInit(){
  try{
    if(!window.claude||typeof window.claude.use!=='function')return;
    const db=await window.claude.use('db');if(!db)return;
    const user=await window.claude.use('user');const uid=user&&await user.id();
    if(!uid){lgDbState='off';return}
    LGDB=db;LGCOL=db.collection('data/users/'+uid);lgDbState='loading';
    const timer=setTimeout(()=>{if(lgDbState==='loading'){lgDbState='slow';lgSafeRender()}},10000);
    let first=true;
    LGCOL.onSnapshot(snap=>{
      const rs={snaps:{},runs:{}};snap.docs.forEach(d=>{const k=d.id[0]==='s'?'snaps':d.id[0]==='r'?'runs':null;if(k)rs[k][d.id]=Object.assign({},d.data())});
      ['snaps','runs'].forEach(k=>{
        if(snap.metadata.fromCache){st.log[k]=Object.assign({},st.log[k],rs[k]);return}
        if(first)Object.keys(st.log[k]).forEach(id=>{if(!rs[k][id]){rs[k][id]=st.log[k][id];lgWrite(k,id,st.log[k][id])}});
        st.log[k]=rs[k];
      });
      if(!snap.metadata.fromCache){first=false;clearTimeout(timer);if(lgDbState!=='ro')lgDbState='on'}
      lgApplyLevel(false);save();lgSafeRender();
    },e=>{clearTimeout(timer);lgDbState='err';LGCOL=null;lgSafeRender()});
    lgSafeRender();
  }catch(e){lgDbState='off'}
})();

/* ---- 애드온 내보내기 가져오기 ---- */
function lgRunFrom(r,src){
  const t=(r.t||0)*1000;
  let xp=null;
  if(r.xp1!=null&&r.xp0!=null){xp=(r.lv1===r.lv0)?r.xp1-r.xp0:((r.xpm0||0)-r.xp0)+r.xp1}
  return {id:'r'+(r.t||Date.now()),t,e:r.e?r.e*1000:null,nm:String(r.nm||''),iid:r.iid||null,dg:lgDg(r.nm,r.iid),lv0:lgNum(r.lv0),lv1:lgNum(r.lv1),xp:xp!=null&&xp>=0?xp:null,party:lgNum(r.party),
    b:(Array.isArray(r.b)?r.b:[]).map(String).slice(0,30),l:(Array.isArray(r.l)?r.l:[]).map(x=>({id:lgNum(x.id),n:String(x.n||''),q:lgNum(x.q)})).slice(0,60),src};
}
function lgSnapFrom(s,src){
  const o={id:'s'+(s.t||Math.floor(Date.now()/1000)),t:(s.t||Math.floor(Date.now()/1000))*1000,src};
  ['lv'].concat(LG_STATS.map(x=>x[0])).forEach(k=>{const v=lgNum(s[k]);if(v!=null)o[k]=v});
  if(s.g&&typeof s.g==='object'){o.g={};Object.keys(s.g).forEach(k=>{const x=s.g[k];if(x&&x.id)o.g[k]={id:lgNum(x.id),n:String(x.n||'')}})}
  return o;
}
function lgImport(text){
  const i=text.indexOf('WFD1:');
  if(i<0)throw new Error('WFD1: 로 시작하는 내용을 찾지 못했어요. 게임에서 /wfd 를 입력한 창의 내용을 전부 복사했는지 확인하세요.');
  let o;try{o=JSON.parse(text.slice(i+5).trim())}catch(e){throw new Error('내용이 중간에 잘린 것 같아요. 창에서 Ctrl+A로 전부 선택한 뒤 다시 복사해 보세요.')}
  let nr=0,ur=0,ns=0;
  (Array.isArray(o.runs)?o.runs:[]).forEach(r=>{const x=lgRunFrom(r,'addon');const old=st.log.runs[x.id];
    if(old&&old.note)x.note=old.note;
    if(!old){nr++;lgPut('runs',x)}else if(JSON.stringify(old)!==JSON.stringify(x)){ur++;lgPut('runs',x)}});
  (Array.isArray(o.hist)?o.hist:[]).forEach(s=>{const x=lgSnapFrom(s,'addon');if(!st.log.snaps[x.id]){ns++;lgPut('snaps',x)}});
  let last=null;if(o.last){last=lgSnapFrom(o.last,'addon');if(!st.log.snaps[last.id])ns++;lgPut('snaps',last)}
  const out=[];
  if(lgApplyLevel(true))out.push('레벨을 '+st.lv+'(으)로 맞췄어요');
  /* 게임에서 낀 장비 중 이 도구 후보에 있는 것은 자동 착용 */
  let eqn=0;
  if(last&&last.g)Object.keys(last.g).forEach(k=>{const S=LG_SLOT[k],id=lgMatch(last.g[k]);if(S&&id&&st.eq[S]!==id){equip(S,id);if(st.eq[S]===id)eqn++}});
  ui.msg='';
  /* 던전에서 주운 후보 아이템은 '획득' 체크 */
  let gn=0;
  Object.values(st.log.runs).forEach(r=>(r.l||[]).forEach(x=>{const id=lgMatch(x);if(id&&!st.got[id]){st.got[id]=1;gn++}}));
  out.unshift('던전 기록 새로 '+nr+'개'+(ur?' · 갱신 '+ur+'개':'')+', 능력치 기록 '+ns+'개를 가져왔어요');
  if(eqn)out.push('게임에서 낀 장비 '+eqn+'개를 장비 탭에 반영했어요');
  if(gn)out.push('던전에서 얻은 후보 아이템 '+gn+'개를 획득으로 체크했어요');
  if(o.cur)out.push('지금 '+(o.cur.nm||'던전')+' 안이라 그 기록은 나온 뒤에 들어와요');
  save();
  return out.join('. ')+'.';
}

/* ---- 스크린샷 읽기 (Claude에게 묻기) ---- */
async function lgShrink(file){
  try{
    const url=URL.createObjectURL(file);
    const im=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=url});
    const k=Math.min(1,1600/Math.max(im.width,im.height));
    const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
    c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(url);
    return await new Promise(ok=>c.toBlob(b=>ok(b||file),'image/jpeg',.88));
  }catch(e){return file}
}

 +'{"kind":"char|run|loot|other","lv":숫자,"str":숫자,"agi":숫자,"sta":숫자,"int":숫자,"spi":숫자,"heal":숫자,"regc":숫자,"armor":숫자,"hpmax":숫자,"mpmax":숫자,"dungeon":"던전 이름","bosses":["보스 이름"],"loot":["아이템 이름"],"note":"한 줄 한국어 요약"}\n'
 +'용어: 힘=str, 민첩성=agi, 체력=sta(스태미나. 생명력과 다름), 지능=int, 정신력=spi, 생명력=hpmax, 마나=mpmax, 방어도=armor, 주문 치유/치유량 보너스/치유 증가=heal, 5초당 마나 회복(시전 중)=regc.\n'
 +'능력치가 "85 (+12)"처럼 보이면 최종 값(괄호 안 보너스가 더해진 큰 숫자)을 쓰세요. 레벨은 "레벨 32" 같은 표시에서 읽으세요.';
async function lgReadShot(file){
  const sample=await window.claude.use('sample');
  if(!sample)throw new Error('이 화면에서는 스크린샷 읽기를 쓸 수 없어요. 아래에 직접 입력해 주세요.');
  try{const lim=await sample.limits();if(lim&&lim.images===false)throw new Error('x')}catch(e){if(e.message==='x')throw new Error('이미지 읽기가 꺼져 있어요. 직접 입력해 주세요.')}
  const blob=await lgShrink(file);
  const r=await sample(LG_PROMPT,{images:[blob],modelTier:'default'});
  const t=String(r&&r.text||''),a=t.indexOf('{'),b=t.lastIndexOf('}');
  if(a<0||b<a)throw new Error('값을 읽지 못했어요. 캐릭터 창이 잘 보이게 다시 찍어 보세요.');
  return JSON.parse(t.slice(a,b+1));
}

   +'<div class="btns"><button class="pri" data-act="lgimport">가져오기</button></div><p class="note" id="lgimpmsg" role="status"></p>'
   +'<p class="note">/wfd now 는 지금 기록 중인 던전을 보여주고, /wfd reset 은 게임 안 기록을 지워요(여기 가져온 기록은 남아요).</p></section>';
  h+='<section class="panel"><h2>2. 스크린샷으로 읽기</h2><p class="note">캐릭터 창(C)이나 던전 전리품 화면을 찍어서 올리면 Claude가 숫자를 읽어 아래 칸을 채워요. 저장 전에 맞는지 확인하세요.</p>'
   +'<label class="filebtn">스크린샷 고르기<input type="file" accept="image/*" data-act="lgshot" hidden></label><p class="note" id="lgshotmsg" role="status">'+esc(ui.lgshotmsg||'')+'</p></section>';
  const dgOpts='<option value="">(던전 기록 안 함)</option>'+DUNGEONS.filter(d=>d.id!=='etc').map(d=>'<option value="'+d.id+'"'+(f.dg===d.id?' selected':'')+'>'+esc(d.ko)+'</option>').join('')
   +LG_OTHER.map(n=>'<option value="o:'+esc(n)+'"'+(f.dg==='o:'+n?' selected':'')+'>'+esc(n)+'</option>').join('');
  const now=new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,16);
  h+='<section class="panel" id="lgformp"><h2>3. 직접 입력'+(ui.lgform?' (스크린샷에서 읽음)':'')+'</h2><form id="lgf" class="f">'
   +'<h3>능력치</h3><div class="stats4">'+LG_FORM.map(k=>'<label>'+LG_LABEL[k].replace(' (시전)','')+'<input name="'+k+'" type="number" step="any" inputmode="decimal" value="'+(f[k]!=null?esc(f[k]):'')+'"></label>').join('')+'</div>'
   +'<h3>던전</h3><label>던전<select name="dg">'+dgOpts+'</select></label>'
   +'<div class="row2"><label>들어간 시각<input name="when" type="datetime-local" value="'+now+'"></label><label>걸린 시간(분)<input name="min" type="number" min="0" inputmode="numeric" value="'+(f.min||'')+'"></label></div>'
   +'<label>잡은 보스 (쉼표로 구분)<input name="bosses" value="'+esc((f.bosses||[]).join(', '))+'"></label>'
   +'<label>얻은 아이템 (쉼표로 구분)<input name="loot" value="'+esc((f.loot||[]).join(', '))+'"></label>'
   +'<label>메모<input name="note" maxlength="120" value="'+esc(f.note||'')+'"></label>'
   +'<div class="btns"><button class="pri" type="submit">저장</button>'+(ui.lgform?'<button type="button" data-act="lgclear">비우기</button>':'')+'</div></form></section>';
  return h;
}

/* ---- 이벤트 ---- */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act;
  if(a==='lgsec'){ui.lgsec=b.dataset.k;ui.lgmsg='';render();window.scrollTo(0,0);return}
  if(a==='lgmore'){ui.lgmore=(ui.lgmore||30)+30;render();return}
  if(a==='lgclear'){ui.lgform=null;ui.lgshotmsg='';render();return}
  if(a==='lgimport'){
    const m=$('lgimpmsg');
    try{const msg=lgImport($('lgpaste').value||'');ui.lgmsg=msg;ui.lgsec='runs';render();window.scrollTo(0,0)}
    catch(x){m.textContent=x.message}
    return;
  }
  if(a==='lgdel'){
    if(b.dataset.c!=='1'){b.dataset.c='1';b.textContent='한 번 더 누르면 지워요';return}
    lgDel(b.dataset.k,b.dataset.id);save();render();return;
  }
  if(a==='lgnote'){
    const r=st.log.runs[b.dataset.id];if(!r)return;
    ui.lgnote=b.dataset.id;render();const f=document.getElementById('lgnote-'+b.dataset.id);if(f)f.focus();return;
  }
  if(a==='lgnotesave'){
    const r=st.log.runs[b.dataset.id];const f=document.getElementById('lgnote-'+b.dataset.id);if(!r||!f)return;
    const x=Object.assign({},r,{note:f.value.slice(0,120)});lgPut('runs',x);ui.lgnote=null;save();render();return;
  }
});
document.addEventListener('change',async e=>{
  const t=e.target;if(!t.dataset||t.dataset.act!=='lgshot')return;
  const f=t.files&&t.files[0];t.value='';if(!f)return;
  const m=$('lgshotmsg');if(m)m.textContent='읽는 중이에요… (처음엔 허용을 묻는 창이 떠요)';
  try{
    const o=await lgReadShot(f);
    const form={};LG_FORM.forEach(k=>{const v=lgNum(o[k]);if(v!=null)form[k]=v});
    if(o.dungeon){const id=lgDg(o.dungeon);form.dg=id||(LG_OTHER.includes(o.dungeon)?'o:'+o.dungeon:'');if(!form.dg)form.note=(o.note?o.note+' · ':'')+'던전: '+o.dungeon}
    if(Array.isArray(o.bosses))form.bosses=o.bosses.map(String).filter(Boolean);
    if(Array.isArray(o.loot))form.loot=o.loot.map(String).filter(Boolean);
    if(o.note&&!form.note)form.note=String(o.note).slice(0,120);
    const n=Object.keys(form).filter(k=>LG_FORM.includes(k)).length;
    ui.lgform=form;ui.lgshotmsg='읽었어요: 능력치 '+n+'개'+(form.dg?' · 던전':'')+(form.loot&&form.loot.length?' · 아이템 '+form.loot.length+'개':'')+'. 아래에서 확인하고 저장하세요.';
    render();const p=$('lgformp');if(p)p.scrollIntoView();
  }catch(x){
    const msg=x&&x.code==='not_granted'?'스크린샷 읽기가 허용되지 않았어요. 직접 입력해 주세요.':x&&x.code==='rate_limited'?'잠깐 너무 많이 썼어요. 조금 뒤 다시 해 주세요.':(x&&x.message)||'읽지 못했어요.';
    ui.lgshotmsg=msg;if(m)m.textContent=msg;
  }
});
document.addEventListener('submit',e=>{
  if(e.target.id!=='lgf')return;
  e.preventDefault();
  const f=new FormData(e.target),src=ui.lgform?'shot':'manual';
  const when=Date.parse(String(f.get('when')||''))||Date.now();
  const out=[];
  const s={id:'s'+Math.floor(when/1000),t:when,src};let ns=0;
  LG_FORM.forEach(k=>{const v=String(f.get(k)||'').trim();if(v!==''&&Number.isFinite(+v)){s[k]=+v;ns++}});
  if(ns){if(st.log.snaps[s.id])s.id+='m';lgPut('snaps',s);out.push('능력치 '+ns+'개')}
  const dv=String(f.get('dg')||'');
  const split=v=>String(v||'').split(/[,，]/).map(x=>x.trim()).filter(Boolean).slice(0,40);
  if(dv){
    const min=parseFloat(f.get('min'));
    const r={id:'r'+Math.floor(when/1000)+'m',t:when,e:Number.isFinite(min)&&min>0?when+min*6e4:null,nm:dv.startsWith('o:')?dv.slice(2):'',dg:dv.startsWith('o:')?null:dv,
      lv0:s.lv||st.lv,lv1:s.lv||st.lv,xp:null,b:split(f.get('bosses')),l:split(f.get('loot')).map(n=>({id:null,n,q:null})),note:String(f.get('note')||'').slice(0,120),src};
    lgPut('runs',r);out.push('던전 기록');
    r.l.forEach(x=>{const id=lgMatch(x);if(id)st.got[id]=1});
  }
  if(!out.length){const m=$('lgshotmsg');ui.lgmsg='저장할 값이 없어요. 능력치나 던전 중 하나는 채워 주세요.';render();return}
  if(s.lv)lgApplyLevel(false);
  ui.lgform=null;ui.lgshotmsg='';ui.lgmsg='저장했어요: '+out.join(', ')+'.';ui.lgsec=dv?'runs':'char';
  save();render();window.scrollTo(0,0);
});

/* ---------- 이벤트 ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act;
  if(a==='got')return; /* change 이벤트에서 처리 */
  if(a==='ovclose'){if(e.target===b){ui.sheet=null;render()}return}
  if(a==='tab'){setTab(b.dataset.t);return}
  if(a==='intro-blank'){Object.keys(st.eq).forEach(k=>st.eq[k]=null);st.got={};st.introDone=1;save();render();return}
  if(a==='intro-keep'){if(SPEC_NOW.id==='disc')st.eq=Object.assign({},EQDEF);st.introDone=1;save();render();return}
  if(a==='char'){switchChar(b.dataset.id);return}
  if(a==='chardel'){if(b.dataset.c!=='1'){b.dataset.c='1';b.textContent='한 번 더 누르면 지워요';return}const id=b.dataset.id;CHARS.list=CHARS.list.filter(c=>c.id!==id);saveChars();try{localStorage.removeItem(keyOf(id))}catch(e){}render();return}
  if(a==='charname'){const v=($('cname').value||'').trim().slice(0,12);st.name=v;const c=CHARS.list.find(c=>c.id===CHARS.cur);if(c)c.name=v;saveChars();save();render();return}
  if(a==='charnew'){const v=($('cnew').value||'').trim().slice(0,12)||'부캐 '+CHARS.list.length;save();const id='c'+Date.now().toString(36);CHARS.list.push({id,name:v});CHARS.cur=id;saveChars();st=Object.assign(fresh(),{eq:blankEq(),introDone:1,name:v,lv:1});save();applySpec();ui.tab='setup';render();window.scrollTo(0,0);return}
  if(a==='spec'){switchSpec(b.dataset.k);if(FIRST_VISIT&&!st.introDone){st.introDone=1}save();render();return}
  if(a==='specreset'){if(SPEC[st.spec].w)st.w=Object.assign({},SPEC[st.spec].w);save();render();return}
  if(a==='lv'){st.lv=Math.max(1,Math.min(60,st.lv+(+b.dataset.d)));save();render();return}
  if(a==='slot'){ui.sheet={mode:'slot',slot:b.dataset.s};render();return}
  if(a==='item'){ui.sheet={mode:'item',id:b.dataset.id,from:b.dataset.from,slot:b.dataset.s||null};render();return}
  if(a==='back'){ui.sheet=ui.sheet.from==='slot'&&ui.sheet.slot?{mode:'slot',slot:ui.sheet.slot}:null;render();return}
  if(a==='close'){ui.sheet=null;render();return}
  if(a==='equip'){equip(b.dataset.s,b.dataset.id);save();if(ui.sheet&&!ui.msg)ui.sheet=null;render();return}
  if(a==='icdel'){if(st.ic)delete st.ic[b.dataset.id];save();render();return}
  if(a==='saveko'){const v=($('koin').value||'').trim();st.ko=st.ko||{};if(v)st.ko[b.dataset.id]=v;else delete st.ko[b.dataset.id];save();render();return}
  if(a==='dsec'){ui.dsec=b.dataset.k;render();window.scrollTo(0,0);return}
  if(a==='csec'){ui.csec=b.dataset.k;render();window.scrollTo(0,0);return}
  if(a==='psec'){ui.psec=b.dataset.k;render();window.scrollTo(0,0);return}
  if(a==='toguide'){ui.dsec='guide';ui.open['g'+b.dataset.id]=true;render();const el=document.getElementById('g'+b.dataset.id);if(el)el.scrollIntoView();return}
  if(a==='qz'){ui.qz=b.dataset.k;render();return}
  if(a==='qmode'){ui.qmode=b.dataset.k;if(b.dataset.d){ui.qdg=b.dataset.d;ui.open['dgq-'+b.dataset.d]=true}render();return}
  if(a==='planall'){ui.planAll=b.dataset.k==='1';render();return}
  if(a==='pf'){ui.pf=b.dataset.k;render();return}
  if(a==='dord'){ui.dord=b.dataset.k;render();return}
  if(a==='lvsec'){ui.lvsec=b.dataset.k;render();window.scrollTo(0,0);return}
  if(a==='dg'){ui.open[b.dataset.id]=b.hasAttribute('aria-expanded')?b.getAttribute('aria-expanded')!=='true':!ui.open[b.dataset.id];render();return}
  if(a==='filter'){ui.f=b.dataset.f;render();return}
  if(a==='preset'){st.preset=b.dataset.k;st.w=Object.assign({},PRESETS[b.dataset.k].w);save();render();return}
  if(a==='addform'){ui.form=true;render();return}
  if(a==='addcancel'){ui.form=false;render();return}
  if(a==='delcustom'){const id=b.dataset.id;st.custom=st.custom.filter(i=>i.id!==id);Object.keys(st.eq).forEach(k=>{if(st.eq[k]===id)st.eq[k]=null});delete st.got[id];save();ui.sheet=null;render();return}
  if(a==='copy'){
    const t=$('bk'),m=$('bkmsg');t.value=JSON.stringify(st);t.select();
    try{navigator.clipboard.writeText(t.value).then(()=>{m.textContent='복사했어요.'},()=>{m.textContent='선택된 내용을 길게 눌러 복사하세요.'})}catch(x){m.textContent='선택된 내용을 길게 눌러 복사하세요.'}
    return;
  }
  if(a==='import'){
    const m=$('bkmsg');
    try{
      const o=JSON.parse($('bk').value);
      if(!o||o.v!==4||!o.eq||!o.w)throw new Error('형식');
      o.got=o.got||{};o.custom=o.custom||[];o.ko=o.ko||{};o.qd=o.qd||{};o.zq=o.zq||{};o.ic=o.ic||{};o.prof=o.prof||{};o.log=o.log||{snaps:{},runs:{}};o.spec=o.spec||'disc';o.by=o.by||{};st=o;save();render();$('bkmsg').textContent='불러왔어요.';
    }catch(x){m.textContent='불러오지 못했어요. 복사한 내용이 전부 들어갔는지 확인하세요.'}
    return;
  }
  if(a==='reset'){
    if(b.dataset.c!=='1'){b.dataset.c='1';b.textContent='한 번 더 누르면 모두 지워요';return}
    st=fresh();ui={tab:'setup',sheet:null,q:'',f:'all',only:true,open:{},msg:'',form:false};save();render();
  }
});
document.addEventListener('change',e=>{
  const t=e.target;if(!t.dataset||!t.dataset.act)return;
  const a=t.dataset.act;
  if(a==='got'){
    if(t.checked)st.got[t.dataset.id]=1;else delete st.got[t.dataset.id];
    save();
    /* 시트가 열려 있으면 그대로 두고, 목록만 갱신 */
    const y=window.scrollY,sh=document.querySelector('.sheet'),sy=sh?sh.scrollTop:0;
    render();window.scrollTo(0,y);const s2=document.querySelector('.sheet');if(s2)s2.scrollTop=sy;
    return;
  }
  if(a==='lvset'){const v=parseInt(t.value,10);if(v>=1&&v<=60){st.lv=v;save()}render();return}
  if(a==='prof2'){const v=Math.max(0,Math.min(300,parseInt(t.value,10)||0));st.prof2=st.prof2||{};st.prof2[t.dataset.k]=v;save();render();return}
  if(a==='prof'){const v=Math.max(0,Math.min(300,parseInt(t.value,10)||0));st.prof=st.prof||{};st.prof[t.dataset.k]=v;save();render();return}
  if(a==='icfile'){const f=t.files&&t.files[0];if(f)openCrop(f,t.dataset.id);t.value='';return}
  if(a==='fq'){st.fq=st.fq||{};if(t.checked)st.fq[t.dataset.k]=1;else delete st.fq[t.dataset.k];save();const y=window.scrollY;render();window.scrollTo(0,y);return}
  if(a==='zq'){st.zq=st.zq||{};if(t.checked)st.zq[t.dataset.k]=1;else delete st.zq[t.dataset.k];save();const y=window.scrollY;render();window.scrollTo(0,y);return}
  if(a==='dgq'){st.dgq=st.dgq||{};if(t.checked)st.dgq[t.dataset.k]=1;else delete st.dgq[t.dataset.k];save();const y=window.scrollY;render();window.scrollTo(0,y);return}
  if(a==='qd'){st.qd=st.qd||{};if(t.checked)st.qd[t.dataset.k]=1;else delete st.qd[t.dataset.k];save();const y=window.scrollY;render();window.scrollTo(0,y);return}
  if(a==='only'){ui.only=t.checked;render();return}
  if(a==='w'){const v=parseFloat(t.value);if(Number.isFinite(v)&&v>=0){st.w[t.dataset.k]=v;if(st.spec==='disc')st.preset=Object.keys(PRESETS).find(k=>KEYS.every(x=>PRESETS[k].w[x]===st.w[x]))||'custom';save();render()}return}
});
document.addEventListener('input',e=>{
  if(e.target.id==='q'){ui.q=e.target.value;const l=$('itemlist');if(l)l.innerHTML=itemsList()}
});
document.addEventListener('submit',e=>{
  if(e.target.id!=='addf')return;
  e.preventDefault();
  const f=new FormData(e.target);
  const nm=String(f.get('nm')||'').trim();if(!nm)return;
  let sl=String(f.get('sl')),ty=null;
  if(sl==='weapon1'){sl='weapon';ty='1h'}else if(sl==='weapon')ty='2h';
  const s={};KEYS.forEach(k=>{s[k]=parseFloat(f.get(k))||0});
  const it={id:'c-'+Date.now().toString(36),nm,sl,lv:Math.max(0,Math.min(60,parseInt(f.get('lv'),10)||0)),s,dg:null,wh:String(f.get('wh')||'').trim()||'직접 입력',kd:'custom'};
  if(ty)it.ty=ty;
  st.custom.push(it);ui.form=false;save();ui.sheet={mode:'item',id:it.id,from:'list',slot:null};render();
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ui.sheet){ui.sheet=null;render()}});
window.addEventListener('hashchange',()=>{const h=(location.hash||'').slice(1);if(TABS.some(t=>t[0]===h)&&h!==ui.tab){ui.tab=h;ui.sheet=null;render()}});
render();
})();
