<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#15130f">
<title>와포 도우미</title>
<meta name="description" content="와우 포에버 얼라이언스 레벨업·장비·퀘스트·던전 도우미">
<style>:root{--bg:#15130f;--panel:#1f1c17;--panel2:#29251e;--line:#3a3429;--txt:#ece6d8;--mute:#a59d8c;--gold:#e8c06a;--gold2:#b8913f;--good:#5fd16b;--bad:#ff7a6b;--blue:#7cb8ff;--warn:#f0b04a;
--q-p:#9d9d9d;--q-c:#f0f0f0;--q-u:#2ee04a;--q-r:#3d8bff;--q-e:#b65cff;--q-l:#ff9a2e;--r:12px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--gold)}
.boot{padding:40px;text-align:center;color:var(--mute)}
#app{max-width:720px;margin:0 auto;padding:0 0 calc(76px + env(safe-area-inset-bottom))}
.mute{color:var(--mute)}
.note{color:var(--mute);font-size:13px;margin:6px 0}
h2{font-size:19px;margin:18px 0 8px}
h3{font-size:15px;margin:16px 0 6px;color:var(--gold)}
.wrap{padding:0 14px}

/* 상단 */
.top{position:sticky;top:0;z-index:20;background:rgba(21,19,15,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:8px 12px calc(8px);display:flex;align-items:center;gap:10px}
.who{display:flex;align-items:center;gap:8px;flex:1;min-width:0;background:none;border:0;padding:4px;border-radius:10px;text-align:left}
.who:active{background:var(--panel)}
.who .t{min-width:0}
.who b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who small{display:block;color:var(--mute);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lvbox{display:flex;align-items:center;gap:4px}
.lvbox button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--panel);font-size:20px;line-height:1}
.lvbox input{width:52px;height:38px;border-radius:10px;border:1px solid var(--gold2);background:var(--panel2);text-align:center;font-size:20px;font-weight:700;color:var(--gold)}
.lvlab{font-size:10px;color:var(--mute);text-align:center;margin-bottom:-2px}

/* 아이콘 */
.ic{display:inline-block;width:36px;height:36px;border-radius:8px;flex:none;background:#000 center/cover;border:1px solid #000;box-shadow:0 0 0 1px var(--line)}
.ic.sm{width:26px;height:26px;border-radius:6px}
.ic.lg{width:46px;height:46px;border-radius:10px}
.ic.q-u{box-shadow:0 0 0 1.5px var(--q-u)}.ic.q-r{box-shadow:0 0 0 1.5px var(--q-r)}.ic.q-e{box-shadow:0 0 0 1.5px var(--q-e)}.ic.q-l{box-shadow:0 0 0 1.5px var(--q-l)}
.ic.empty{background:var(--panel2);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--mute)}
.qp{color:var(--q-p)}.qc{color:var(--q-c)}.qu{color:var(--q-u)}.qr{color:var(--q-r)}.qe{color:var(--q-e)}.ql{color:var(--q-l)}

/* 하단 탭 */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(24,21,17,.98);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
.tabs .in{display:flex;max-width:720px;width:100%}
.tabs button{flex:1;background:none;border:0;padding:8px 0 9px;color:var(--mute);font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px}
.tabs button .e{font-size:20px;line-height:1.1;filter:grayscale(.6)}
.tabs button.on{color:var(--gold)}
.tabs button.on .e{filter:none}

/* 카드 */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin:10px 0}
.card.hl{border-color:var(--gold2)}
.card h3{margin-top:0}
.card .hd{display:flex;align-items:center;justify-content:space-between;gap:8px}
.card .hd h3{margin:0}
.more{background:none;border:0;color:var(--gold);font-size:13px;padding:4px 0}
.row{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.row:first-child{border-top:0}
button.row:active{background:var(--panel2)}
.row .m{flex:1;min-width:0}
.row .nm{display:block;font-weight:600;line-height:1.35}
.row .sub{display:block;font-size:12.5px;color:var(--mute);line-height:1.4}
.row .r{flex:none;text-align:right;font-size:12px}
.list .row:first-child{border-top:0}

.chips{display:flex;gap:6px;overflow-x:auto;padding:6px 0 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 13px;font-size:13.5px;white-space:nowrap}
.chip.on{border-color:var(--gold);background:#3a301b;color:var(--gold)}
.chip .n{color:var(--mute);margin-left:3px;font-size:12px}
.tag{display:inline-block;font-size:11px;border:1px solid var(--line);border-radius:6px;padding:0 6px;margin:2px 4px 0 0;color:var(--mute);line-height:1.6}
.tag.lk{border-color:#2f5a8a;color:#9ccaff}
.tag.pre{border-color:#6a5420;color:var(--warn)}
.tag.dg{border-color:#5a3f6e;color:#d6a8ff}
.tag.gd{border-color:#2d5a33;color:var(--good)}

.lvb{flex:none;min-width:34px;height:26px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;background:var(--panel2);border:1px solid var(--line)}
.lv-r{color:#ff6b5b;border-color:#6b2a24}.lv-o{color:#ffa94d;border-color:#6b4724}.lv-y{color:#ffe066;border-color:#6b5f24}.lv-g{color:#69db7c;border-color:#24502c}.lv-x{color:#999}

.dif{display:block;font-size:12.5px;margin-top:1px}
.dif .p{color:var(--good)}.dif .n{color:var(--bad)}
.gain{font-size:12px;font-weight:700;border-radius:6px;padding:2px 7px;white-space:nowrap}
.gain.big{background:#1f4d27;color:#8af59a}.gain.mid{background:#26402a;color:#7bd987}.gain.sm{background:#2a3327;color:#a8c9a8}.gain.new{background:#4a3c17;color:var(--gold)}.gain.no{background:var(--panel2);color:var(--mute)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--gold2);background:#3a301b;color:var(--gold);border-radius:10px;padding:10px 16px;font-weight:700;min-height:44px}
.btn.full{width:100%}
.btn.ghost{background:var(--panel);border-color:var(--line);color:var(--txt);font-weight:500}
.btn.danger{border-color:#6b2a24;color:var(--bad);background:var(--panel)}
.btn.sm{min-height:34px;padding:5px 12px;font-size:13px}

/* 시작 화면 */
.hero{padding:34px 18px 10px;text-align:center}
.hero h1{margin:6px 0 4px;font-size:28px;color:var(--gold);letter-spacing:-.5px}
.hero p{margin:0;color:var(--mute)}
.hero .logo{font-size:44px}
.step{margin:18px 14px}
.step .q{font-weight:700;margin-bottom:8px}
.step .q span{display:inline-flex;width:22px;height:22px;border-radius:50%;background:var(--gold2);color:#1a1408;font-size:13px;align-items:center;justify-content:center;margin-right:6px}
.inp{width:100%;height:46px;border-radius:10px;border:1px solid var(--line);background:var(--panel);padding:0 12px;font-size:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.pick{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:14px}
.pick.on{border-color:var(--gold);background:#3a301b}
.pick small{color:var(--mute);font-size:11px}
.lvpick{display:flex;align-items:center;gap:10px}
.lvpick input{width:90px;height:52px;font-size:26px;font-weight:700;text-align:center;border-radius:12px;border:1px solid var(--gold2);background:var(--panel2);color:var(--gold)}
.lvpick button{width:52px;height:52px;border-radius:12px;border:1px solid var(--line);background:var(--panel);font-size:24px}

/* 장비 인형 */
.doll{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px}
.slot{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 8px;text-align:left;min-height:52px;position:relative}
.slot .m{min-width:0;flex:1}
.slot .sn{display:block;font-size:11px;color:var(--mute)}
.slot .in{display:block;font-size:13px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.slot .up{position:absolute;top:-6px;right:-4px;background:var(--good);color:#06290c;font-size:10px;font-weight:800;border-radius:8px;padding:0 5px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:2px 14px;font-size:13px}
.stats div{display:flex;justify-content:space-between;border-bottom:1px dashed var(--line);padding:2px 0}

/* 시트(아래에서 올라오는 창) */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);border:1px solid var(--line);border-bottom:0;border-radius:16px 16px 0 0;width:100%;max-width:720px;max-height:88vh;overflow:auto;padding:6px 14px calc(20px + env(safe-area-inset-bottom))}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 6px}
.sheet .sh{display:flex;align-items:center;justify-content:space-between;position:sticky;top:-6px;background:var(--bg);padding:6px 0;z-index:2}
.sheet .sh h2{margin:0;font-size:17px}
.x{background:var(--panel);border:1px solid var(--line);border-radius:10px;width:36px;height:36px;font-size:18px}

/* 퀘스트 */
.qrow{display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--line);align-items:flex-start}
.qrow:first-child{border-top:0}
.qrow input{width:22px;height:22px;margin:2px 0 0;accent-color:var(--gold);flex:none}
.qrow .m{flex:1;min-width:0}
.qrow .nm{font-weight:600}
.qrow .obj{display:block;font-size:13px;color:#d9d2c3;margin-top:1px}
.qrow .sub{display:block;font-size:12px;color:var(--mute)}
.qrow.done .nm{text-decoration:line-through;color:var(--mute)}
.qrow.done .obj{display:none}
.qrow.lock{opacity:.55}
.hubh{display:flex;align-items:center;gap:8px;margin:0}
.hubh .no{width:24px;height:24px;border-radius:50%;background:var(--gold2);color:#1a1408;font-weight:800;font-size:13px;display:inline-flex;align-items:center;justify-content:center;flex:none}
details.fold{margin-top:6px}
details.fold summary{color:var(--mute);font-size:13px;cursor:pointer;padding:4px 0}
.rewards{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}
.rw{display:inline-flex;align-items:center;gap:4px;font-size:12px;background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:1px 6px 1px 2px}
.rw .ic{width:18px;height:18px;border-radius:4px}
.rw.mine{border-color:#2d5a33}

/* 던전 */
.boss{display:flex;align-items:center;gap:8px;margin:14px 0 4px}
.boss .no{width:24px;height:24px;border-radius:6px;background:#3d2a4a;color:#e6c7ff;font-weight:800;font-size:12px;display:inline-flex;align-items:center;justify-content:center}
.boss b{font-size:15px}
.rng{font-size:12px;color:var(--mute)}
.bar{height:6px;border-radius:3px;background:var(--panel2);position:relative;margin-top:6px}
.bar i{position:absolute;top:0;bottom:0;background:var(--gold2);border-radius:3px}
.bar b{position:absolute;top:-3px;width:3px;height:12px;background:var(--good);border-radius:2px}

/* 직업 */
.tl{display:flex;gap:10px;padding:7px 0;border-top:1px solid var(--line)}
.tl:first-child{border-top:0}
.tl.now{background:linear-gradient(90deg,#3a301b,transparent);margin:0 -14px;padding:7px 14px}
.tl.done{opacity:.55}
.rot{padding:8px 0;border-top:1px solid var(--line)}
.rot:first-child{border-top:0}
.rot .w{font-size:12px;color:var(--gold);font-weight:700}
.ab{display:inline-flex;align-items:center;gap:3px;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:0 5px 0 2px;margin:1px 1px;font-size:13px;white-space:nowrap}
.ab .ic{width:18px;height:18px;border-radius:4px}
.ab.no{opacity:.45}
.ab .l{font-size:10px;color:var(--mute)}
.empty-st{padding:28px 10px;text-align:center;color:var(--mute)}
.srch{position:relative;margin:6px 0}
.srch input{padding-left:34px}
.srch:before{content:"🔍";position:absolute;left:10px;top:12px;font-size:15px;opacity:.7}
.foot{font-size:12px;color:var(--mute);padding:20px 14px;text-align:center}
.foot a{color:var(--mute)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#3a301b;border:1px solid var(--gold2);color:var(--gold);padding:8px 16px;border-radius:999px;z-index:60;font-size:14px}
@media (min-width:560px){.doll{grid-template-columns:1fr 1fr 1fr}}

/* 전투정보실 모양 */
.armory{display:grid;grid-template-columns:auto 1fr auto;gap:8px;margin-top:12px;background:radial-gradient(ellipse at 50% 35%,#2c261c 0%,#1a1712 70%);border:1px solid var(--line);border-radius:14px;padding:10px 8px}
.acol{display:flex;flex-direction:column;justify-content:space-between;gap:6px}
.amid{display:flex;flex-direction:column;align-items:center;text-align:center;padding-top:6px;min-width:0}
.amid b{font-size:16px;margin-top:6px}
.amid small{color:var(--mute);font-size:12px}
.ic.xl{width:64px;height:64px;border-radius:50%;box-shadow:0 0 0 2px var(--gold2),0 0 18px rgba(232,192,106,.25)}
.ast{width:100%;margin-top:8px;font-size:12.5px}
.ast div{display:flex;justify-content:space-between;padding:2px 2px;border-bottom:1px dashed var(--line)}
.ast b{font-size:12.5px;margin:0;color:var(--gold)}
.abot{display:flex;justify-content:center;gap:10px;margin-top:-1px;background:#1a1712;border:1px solid var(--line);border-top:0;border-radius:0 0 14px 14px;padding:8px}
.dc{position:relative;background:none;border:0;padding:0;line-height:0;display:block}
.dc .ic{display:block}
.dc .ic.empty{display:flex;align-items:center;justify-content:center}
.dc .ic.lg{width:46px;height:46px}
.dc .ic.empty{font-size:10px;line-height:1.1;text-align:center;padding:2px;color:#6d6656;background:#14120e;box-shadow:0 0 0 1px #3a3429 inset}
.dc.sel .ic{outline:2px solid var(--gold);outline-offset:2px}
.dc .up{position:absolute;top:-5px;right:-5px;background:var(--good);color:#06290c;font-size:9px;font-weight:800;border-radius:6px;padding:1px 3px;line-height:1.2}
.dc:disabled{opacity:.5}
.spanel h3{margin:10px 0 4px}
.rec{border-top:1px solid var(--line);padding:6px 0 10px}
.chg{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12.5px;margin:2px 0 8px 46px}
.chg .p{color:var(--good)}.chg .n{color:var(--bad)}
.chg i{font-style:normal;color:var(--mute);font-size:11px}
@media (min-width:640px){.dc .ic.lg{width:52px;height:52px}.armory{gap:16px;padding:14px}}

/* 정보 버튼·출처 */
.ib{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--panel2);color:var(--gold);font-size:15px;line-height:1;margin-top:6px;padding:0}
.row.tap{cursor:pointer}
.src{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0}
.src b{display:block;font-size:13px;color:var(--gold)}
.src .nm{font-weight:700;margin:3px 0}
.src .obj{font-size:13px;color:#d9d2c3}
.src .sub{font-size:12.5px;color:var(--mute)}
.src .btn{margin-top:8px}
.tag.ct{border-color:#3d5a7a;color:#a9cdf5}
button.rw{color:inherit;cursor:pointer}
/* 던전 체크 */
.ck{padding:8px 0;border-top:1px solid var(--line)}
.ck:first-of-type{border-top:0}
.bk{display:flex;gap:8px;padding:6px 0}
.bk .no{width:22px;height:22px;border-radius:6px;background:#3d2a4a;color:#e6c7ff;font-weight:800;font-size:12px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.bk .m{flex:1;min-width:0}
.pk{display:inline-flex;align-items:center;gap:3px;background:#24301f;border:1px solid #2d5a33;border-radius:7px;padding:2px 7px;margin:3px 4px 0 0;font-size:12.5px;color:var(--good)}
.pk small{color:var(--mute);font-size:11px}
/* 레벨링 루트 */
.rt{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.rt.now{background:linear-gradient(90deg,#3a301b,transparent);margin:0 -14px;padding:10px 14px;border-radius:10px}
.rt.past{opacity:.55}
.rl{flex:none;width:62px;display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.rl .lvb{min-width:56px}
.rt .m{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.zr{display:block;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px;width:100%}
.zr .sub{display:block;font-size:12px;color:var(--mute)}
.mv{font-size:12.5px;color:#a9cdf5;background:#16222e;border:1px solid #2c4560;border-radius:10px;padding:8px 10px;margin:6px 0}
.zh{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:4px 0 6px}
.zh b{font-size:16px}
.zh .sub{display:block;font-size:12.5px;color:var(--mute);margin-top:2px}
.zh .more{font-size:12.5px;padding:0}
.bk .m b{display:block}

/* 퀘스트 할 일·연계 */
.qt{display:flex;flex-direction:column;gap:2px;margin:4px 0 2px;padding:6px 8px;background:#1b1914;border:1px solid var(--line);border-radius:8px;font-size:13px}
.qt .ti b{color:#f3e6c4}
.qt .sub{font-size:12px;color:var(--mute)}
.chn{display:flex;flex-direction:column;gap:3px;margin-top:5px;padding:6px 8px;border-left:3px solid #2f5a8a;background:#141c25;border-radius:0 8px 8px 0;font-size:12.5px}
.chn .cp{color:var(--mute)}
.chn .cn{color:#cfe3ff}
.chn .sub{color:var(--mute);font-size:12px}
.lvb.sm{min-width:24px;height:18px;font-size:11px;border-radius:5px}

/* 펼치는 퀘스트 (트레들리 느낌) */
details.qf{margin:8px 0;border-radius:10px;background:linear-gradient(#2a2418,#1d1912);border:1px solid #6b5426;box-shadow:inset 0 0 0 1px #1a150d,inset 0 1px 0 #8a6d33,0 2px 0 #0d0b08}
details.qf summary{list-style:none;display:flex;align-items:center;gap:8px;padding:12px 12px;cursor:pointer}
details.qf summary::-webkit-details-marker{display:none}
.qf .qi{flex:none;width:18px;text-align:center;font-weight:900;color:#ffd200;font-size:17px;text-shadow:0 0 4px rgba(255,210,0,.5)}
.qf.done .qi{color:var(--good);text-shadow:none}
.qf .qn{flex:1;min-width:0;font-weight:800;color:#f1c34a;font-size:15.5px;line-height:1.3;font-family:Georgia,"Apple SD Gothic Neo","Noto Serif KR",serif}
.qf.done .qn{color:var(--mute);text-decoration:line-through}
.qf.lock .qn{color:#b19a64}
.qf .qs{flex:none;font-size:12px;color:#7cb8ff;font-weight:700}
.qf .qs .lk{color:#9ccaff}
.qf .chev{flex:none;color:#e0c47a;font-size:18px;transition:transform .15s;line-height:1}
.qf[open] .chev{transform:rotate(180deg)}
.qf .qb{padding:0 12px 12px 38px;font-size:13.5px}
.qf .qb .obj{color:#e8dfcb;margin:2px 0 4px}

function cands(c,slot,maxLv,mode){const w=wOf(c);return ITEMS.filter(it=>it.ob<=maxLv&&usable(it,c)&&fits(it,slot,c)&&srcOk(it,mode)&&it.ph!=='x').map(it=>({it,s:sc(it,slot,w)})).filter(x=>x.s>0).sort((a,b)=>b.s-a.s)}
function upgrades(c,L,mode,minLv){const out=[];const w=wOf(c);
  for(const [slot] of SLOTS){if(slot==='ring2'||slot==='trink2')continue;
    const pair=slot==='ring1'?['ring1','ring2']:slot==='trink1'?['trink1','trink2']:[slot];
    const curS=Math.min(...pair.map(p=>sc(eqIt(c,p),p,w)));const tgt=pair.reduce((a,p)=>sc(eqIt(c,p),p,w)<=sc(eqIt(c,a),a,w)?p:a,pair[0]);
    let base=curS;if(slot==='main')base=sc(eqIt(c,'main'),'main',w)+(0);
    if(slot==='off'&&eqIt(c,'main')&&eqIt(c,'main').sl==='2h')continue;
    const have=new Set(pair.map(p=>c.eq[p]).filter(Boolean));
    const list=cands(c,slot,L,mode).filter(x=>!have.has(x.it.id)&&(minLv==null||x.it.ob>=minLv));
    for(const x of list.slice(0,1)){let g;
      if(slot==='main'&&x.it.sl==='2h')g=x.s-(sc(eqIt(c,'main'),'main',w)+sc(eqIt(c,'off'),'off',w));else g=x.s-base;
      if(g>.01)out.push({slot:tgt,it:x.it,g,base:slot==='main'&&x.it.sl==='2h'?sc(eqIt(c,'main'),'main',w)+sc(eqIt(c,'off'),'off',w):base,empty:!eqIt(c,tgt)})}}
  return out.sort((a,b)=>(b.empty-a.empty)||(b.g/Math.max(b.base,4))-(a.g/Math.max(a.base,4)))}
function gainTag(g,base,empty){if(empty)return '<span class="gain new">빈 칸 채우기</span>';if(g<-.5)return '<span class="gain no" style="color:var(--bad)">나빠짐</span>';if(!(g>.01))return '<span class="gain no">변화 없음</span>';const r=g/Math.max(base,4);return r>=.5?'<span class="gain big">크게 좋아짐</span>':r>=.2?'<span class="gain mid">좋아짐</span>':'<span class="gain sm">조금 좋아짐</span>'}
function diffHtml(a,b,c){const w=wOf(c);const ks=new Set([...Object.keys(a?a.st:{}),...Object.keys(b?b.st:{})]);const arr=[];

  return Object.values(Z).map(o=>({z:o.z,q:o.q,left:o.q.filter(q=>!fq[o.z+'|'+q.nm]).length})).filter(o=>o.q.length).sort((a,b)=>b.left-a.left)}

     +(done.length?'<details class="fold"><summary>끝낸 퀘스트 '+done.length+'개</summary>'+done.map(q=>qRow(c,z.z,q)).join('')+'</details>':'')+'</div>'}).join('');
  h+='<p class="note">퀘스트 레벨 색: <span class="lvb lv-r" style="min-width:24px;height:18px">빨</span> 어려움 · <span class="lvb lv-y" style="min-width:24px;height:18px">노</span> 적당 · <span class="lvb lv-g" style="min-width:24px;height:18px">초</span> 쉬움. <span class="tag lk">연계</span>는 끝내면 다음 퀘스트가 이어지고, <span class="tag pre">앞 퀘스트 먼저</span>는 앞 단계를 끝내야 받을 수 있어요.</p>';
  return h+'</div>'}
/* 펼치는 퀘스트 한 줄: 접혀 있을 땐 [레벨] 이름만, 누르면 할 일·위치·연계·보상 */
function qFold(o){const open=ui.qopen===o.key;
  return '<details class="qf'+(o.done?' done':'')+(o.lock?' lock':'')+'"'+(open?' open':'')+' data-k="'+esc(o.key)+'"><summary><span class="qi">'+(o.done?'✓':'!')+'</span><span class="qn">['+o.lv+'] '+esc(o.nm)+'</span>'
   +(o.side?'<span class="qs">'+o.side+'</span>':'')+'<span class="chev">⌄</span></summary>'+o.body+'</details>'}
function qRow(c,z,q){const k=z+'|'+q.nm,d=!!(c.fq||{})[k],L=c.lv,lock=q.min>L;
  const tags=(q.pre?'<span class="tag pre">앞 퀘스트 '+q.pre+'개 먼저</span>':'')+chainTag(q.id,q)+(lock?'<span class="tag">'+q.min+'레벨부터</span>':'');
  const isCh=q.ch||(QD.get(q.id)&&QD.get(q.id).cn>1);
  const body=parch(c,q.id,{nm:q.nm,obj:q.obj,gv:q.gv,xy:q.xy,place:esc(z)+' '+(CONT[z]?CONT_IC[CONT[z]]:''),tags,done:d,kind:'fq',ck:k,chN:q.ch});
  return qFold({key:'f'+k,done:d,lock,lv:q.lv,nm:q.nm,body,side:isCh?'<span class="lk">연계</span>':''})}
function dqView(c){const L=c.lv;const near=DGS.filter(d=>d.q.length&&d.q.some(q=>q.min<=L+2&&q.lv>=L-4)&&d.lo<=L+3);const rest=DGS.filter(d=>d.q.length&&!near.includes(d));
  let h='<p class="note">던전마다 얼라이언스가 받을 수 있는 퀘스트예요. <b>던전 가기 전에</b> 마을에서 미리 받아 두면 한 번에 끝낼 수 있어요.</p>';
  h+=near.length?near.map(d=>dqCard(c,d,true)).join(''):'<p class="empty-st">지금 레벨에 맞는 던전 퀘스트가 없어요.</p>';
  h+='<details class="fold"><summary>다른 던전 퀘스트 모두 보기 ('+rest.length+'곳)</summary>'+rest.map(d=>dqCard(c,d,false)).join('')+'</details>';
  return h}
function dqCard(c,d,open){const dq=c.dq||{};const done=d.q.filter(q=>dq[q.id]).length;
  return '<details class="card"'+(open?' open':'')+'><summary style="cursor:pointer;list-style:none"><div class="hd"><h3 style="margin:0">'+esc(d.ko)+'</h3><span class="mute" style="font-size:12px">'+done+'/'+d.q.length+' · 권장 '+d.lo+'–'+d.hi+'</span></div></summary>'+dqList(c,d)+'<button class="more" data-a="dgo" data-k="'+d.slug+'">던전 보스·드랍 보기 ›</button></details>'}
function dqList(c,d,flat){const L=c.lv;const dq=c.dq||{};
  const outQ=d.q.filter(q=>!/던전 안/.test(q.start)&&q.start),inQ=d.q.filter(q=>/던전 안/.test(q.start)||!q.start);
  const row=q=>{const dn=!!dq[q.id],lock=q.min>L;const rw=q.rw.map(id=>IT.get(id)).filter(Boolean);
    const tags=(q.pre?'<span class="tag pre">앞 퀘스트 먼저</span>':'')+chainTag(q.id,q)+(lock?'<span class="tag">'+q.min+'레벨부터</span>':'');
    const inside=/던전 안/.test(q.start||'')||/아이템/.test(q.start||'')||!q.start;
    const extra=(q.boss.length?'<p class="npc">🎯 던전 안 목표: <b>'+q.boss.map(b=>esc(b.replace(/^(\d+) /,'$1번 '))).join(', ')+'</b></p>':'')+'<p class="npc">'+esc(startTxt(q.start))+'</p>';
    const rwHtml=rw.length?'<div class="rgrid">'+rw.map(it=>'<button class="rt2" data-a="info" data-k="'+it.id+'">'+itIcon(it)+'<span class="rn q'+it.q+'">'+esc(it.nm)+'</span></button>').join('')+'</div>':'';
    const body=parch(c,q.id,{nm:q.nm,obj:q.obj,place:inside?'던전 안에서 시작':'던전 외부 시작',tags,extra,rwHtml,done:dn,kind:'dq',ck:String(q.id)});
    return qFold({key:'d'+q.id,done:dn,lock,lv:q.lv,nm:q.nm,body,side:q.side==='alliance'?'얼라이언스':''})};
  if(flat)return d.q.map(row).join('');
  return (outQ.length?'<h3>던전 가기 전에 받기</h3>'+outQ.map(row).join(''):'')+(inQ.length?'<h3>던전 안에서 시작</h3>'+inQ.map(row).join(''):'')}
function startTxt(s){if(!s)return '아이템을 주워서 시작';if(/^시작 · 던전 안/.test(s))return '던전 안에서 받아요';const m=s.match(/^시작 (.+) · 던전 안$/);if(m)return '던전 안 '+m[1]+'에게 받아요';if(/^시작 · /.test(s))return s.replace(/^시작 · /,'')+'에서 시작';return '받는 곳: '+s}

/* ===================== 던전 ===================== */
function dgItems(c,d){return ITEMS.filter(it=>it.src.some(i=>SRC[i]&&SRC[i].k===0&&SRC[i].dg===d.slug))}
function dgUps(c,d){const L=c.lv;return dgItems(c,d).filter(it=>usable(it,c)&&it.lv<=Math.max(L,d.hi)).map(it=>({it,b:bestSlot(it,c)})).filter(x=>x.b&&x.b.g>.01)}
function dungeon(c){if(ui.dg&&DG[ui.dg])return dgDetail(c,DG[ui.dg]);const L=c.lv;
  let h='<div class="wrap"><h2>던전</h2><p class="note">적정 레벨 순서예요. 막대의 초록 선이 내 레벨 '+L+'이에요. 누르면 보스 순서, 내 직업 드랍, 퀘스트를 보여 줘요.</p>';
  const lst=DGS.slice().sort((a,b)=>a.fit-b.fit);
  h+=lst.map(d=>{const inr=L>=d.lo-1&&L<=d.hi;const ups=inr||L<d.lo?dgUps(c,d).length:0;const pos=Math.max(0,Math.min(100,(L-10)/50*100));
    return '<button class="card row'+(inr?' hl':'')+'" style="display:flex" data-a="dgo" data-k="'+d.slug+'"><span class="m"><span class="nm">'+esc(d.ko)+(inr?' <span class="tag gd">지금 레벨</span>':'')+'</span><span class="sub">권장 '+d.lo+'–'+d.hi+' · '+esc(d.loc)+(d.q.length?' · 퀘스트 '+d.q.length:'')+(ups?' · 내 장비 '+ups:'')+'</span>'
     +'<span class="bar"><i style="left:'+((d.lo-10)/50*100)+'%;width:'+((d.hi-d.lo)/50*100)+'%"></i><b style="left:'+pos+'%"></b></span></span><span class="r">›</span></button>'}).join('');
  return h+'</div>'}
function dgDetail(c,d){const L=c.lv;const items=dgItems(c,d);
  let h='<div class="wrap"><button class="more" data-a="dgback">‹ 던전 목록</button><h2 style="margin-top:4px">'+esc(d.ko)+'</h2><p class="note">'+esc(d.en)+' · '+esc(d.loc)+' · 권장 '+d.lo+'–'+d.hi+' (적정 '+d.fit+')</p>';
  h+='<div class="chips">'+[['me','내 직업 장비만'],['all','드랍 전부']].map(f=>'<button class="chip'+((ui.dgf||'me')===f[0]?' on':'')+'" data-a="dgf" data-k="'+f[0]+'">'+f[1]+'</button>').join('')+'</div>';
  const mine=(ui.dgf||'me')==='me';
  const byBoss={};items.forEach(it=>{const s=it.src.map(i=>SRC[i]).find(s=>s&&s.k===0&&s.dg===d.slug);const b=s?s.boss:'기타';(byBoss[b]=byBoss[b]||[]).push(it)});
  const order=d.bosses.map(b=>b.nm);Object.keys(byBoss).forEach(b=>{if(!order.includes(b))order.push(b)});
  /* 가기 전 체크: 미리 받을 퀘스트 + 보스별 챙길 것 */
  {const dqd=c.dq||{};const pre=d.q.filter(q=>q.start&&!/던전 안|아이템/.test(q.start)&&!dqd[q.id]&&q.min<=L+1);
   const wantRw=[];d.q.forEach(q=>q.rw.forEach(id=>{const it=IT.get(id);if(it&&usable(it,c)){const bs=bestSlot(it,c);if(bs&&bs.g>.01)wantRw.push({it,bs,q})}}));
   let p='<div class="card hl"><h3>🎒 들어가기 전 체크</h3>';
   p+='<div class="ck"><b>1. 마을에서 미리 받을 퀘스트 '+pre.length+'개</b><p class="note">눌러서 펼치면 받는 곳·할 일·보상이 나와요.</p>'+(pre.length?dqList(c,{q:pre},true):'<div class="sub">없어요 (또는 다 받았어요)</div>')+'</div>';
   p+='<div class="ck"><b>2. 보스별로 챙길 것</b>'+order.map((b,i)=>{const ups=(byBoss[b]||[]).filter(it=>usable(it,c)).map(it=>({it,bs:bestSlot(it,c)})).filter(x=>x.bs&&x.bs.g>.01).sort((x,y)=>y.bs.g-x.bs.g);
      return '<div class="bk"><span class="no">'+(i+1)+'</span><span class="m"><b>'+esc(b)+'</b><span class="sub">'+(ups.length?ups.map(x=>'<button class="pk" data-a="info" data-k="'+x.it.id+'">★ <span class="q'+x.it.q+'">'+esc(x.it.nm)+'</span> <small>'+SLOT_KO[x.bs.s]+'</small></button>').join(''):'<span class="mute">챙길 것 없음</span>')+'</span></span></div>'}).join('')+'</div>';
   if(wantRw.length)p+='<div class="ck"><b>3. 퀘스트 보상으로 받을 것</b>'+wantRw.map(x=>'<div class="sub"><button class="pk" data-a="info" data-k="'+x.it.id+'">★ <span class="q'+x.it.q+'">'+esc(x.it.nm)+'</span></button> ← 「'+esc(x.q.nm)+'」</div>').join('')+'</div>';
   h+=p+'<p class="note">★를 누르면 어떤 장비인지, 얼마나 좋아지는지 보여 줘요.</p></div>'}
  h+='<div class="card"><h3>보스 순서와 드랍 (전체)</h3>'+order.map((b,i)=>{let its=(byBoss[b]||[]);if(mine)its=its.filter(it=>usable(it,c));
     const rows=its.map(it=>{const bs=bestSlot(it,c);const cur=bs?eqIt(c,bs.s):null;return {it,bs,cur}}).sort((x,y)=>((y.bs?y.bs.g:-1)-(x.bs?x.bs.g:-1)));
     return '<div class="boss"><span class="no">'+(i+1)+'</span><b>'+esc(b)+'</b></div>'+(rows.length?rows.map(r=>'<div class="row">'+itIcon(r.it)+'<span class="m"><span class="nm">'+itName(r.it)+'</span><span class="sub">'+itMeta(r.it)+'</span>'+(usable(r.it,c)?diffHtml(r.it,r.cur,c):'<span class="sub">내 직업은 못 써요</span>')+'</span><span class="r">'+(r.bs?gainTag(r.bs.g,r.bs.base,r.bs.empty):'')+'<br>'+infoBtn(r.it)+'</span></div>').join(''):'<p class="note" style="margin:2px 0 0 32px">'+(mine?'내 직업이 쓸 드랍이 없어요.':'드랍 정보가 없어요.')+'</p>')}).join('')+'</div>';
  if(d.q.length)h+='<div class="card"><h3>이 던전 퀘스트 (얼라이언스)</h3>'+dqList(c,d)+'</div>';
  h+='<p class="note"><a href="https://forg.gg/forever/dungeons/'+d.slug+'" target="_blank" rel="noopener">forg.gg에서 지도·보스 공략 보기 ↗</a></p>';
  return h+'</div>'}

/* ===================== 직업 ===================== */
const CSEC=[['tal','특성 순서'],['rot','운영·딜 순서'],['learn','기술 습득'],['prof','전문기술']];
function talRow(C,s,L){const t=C.talents[s[1]]||[s[1],'',1];return '<div class="tl'+(s[0]===L?' now':s[0]<L?' done':'')+'"><span class="lvb '+lvCls(s[0],L)+'">'+s[0]+'</span><span class="m"><b>'+esc(t[0])+'</b> <span class="mute">'+s[2]+'/'+t[2]+' · '+esc(t[1])+'</span>'+(t[4]&&s[0]>=L-1&&s[0]<=L+1?'<span class="sub">'+esc(t[4])+'</span>':'')+'</span></div>'}
function rotHtml(C,txt,L){return esc(txt).replace(/\[([^\]@*]+)(?:@(\d+))?(\*)?\]/g,(m,n,lv,t)=>{const icon=abIcon(n,C);const no=lv&&+lv>L;return '<span class="ab'+(no?' no':'')+'">'+(icon?'<span class="ic" style="background-image:url('+ICO(icon)+')"></span>':'')+n+(lv?' <span class="l">'+lv+'</span>':'')+(t?' <span class="l">특성</span>':'')+'</span>'})}
function klass(c){const C=D_CLS[c.cls],sp=specOf(c),L=c.lv,sec=ui.csec;
  let h='<div class="wrap"><h2>'+esc(CINFO[c.cls][0])+'</h2><div class="chips">'+C.specs.map(s=>'<button class="chip'+(s.id===c.spec?' on':'')+'" data-a="spec" data-k="'+s.id+'">'+esc(s.name)+'</button>').join('')+'</div>';
  h+='<div class="chips">'+CSEC.map(x=>'<button class="chip'+(sec===x[0]?' on':'')+'" data-a="csec" data-k="'+x[0]+'">'+x[1]+'</button>').join('')+'</div>';
  if(sec==='tal'){const pts=Math.max(0,L-9);const st=sp.steps;const sum={};st.filter(s=>s[0]<=60).forEach(s=>{const t=C.talents[s[1]];if(t)sum[t[1]]=(sum[t[1]]||0)+1});
    h+='<div class="card"><h3>'+esc(sp.name)+' 특성 순서</h3><p class="note">레벨 '+L+'이면 특성 포인트 '+pts+'개예요. 60레벨 완성: '+C.trees.map(t=>esc(t)+' '+(sum[t]||0)).join(' · ')+'</p>';
    const now=st.filter(s=>s[0]>=L-1&&s[0]<=L+4);if(L>=9&&now.length)h+=now.map(s=>talRow(C,s,L)).join('');
    h+='<details class="fold"><summary>10~60 전체 순서</summary>'+st.map(s=>talRow(C,s,L)).join('')+'</details><p class="note"><a href="https://forg.gg/forever/classes/'+c.cls+'?spec='+sp.id+'" target="_blank" rel="noopener">forg.gg에서 특성 트리로 보기 ↗</a></p></div>'}
  if(sec==='rot'){const blk=(t,arr)=>arr.length?'<div class="card"><h3>'+t+'</h3>'+arr.map(r=>'<div class="rot"><div class="w">'+esc(r[0])+'</div><div>'+rotHtml(C,r[1],L)+'</div></div>').join('')+'</div>':'';
    h+='<p class="note">흐린 기술은 아직 못 배운 거예요. 숫자는 배우는 레벨이에요.</p>'+(L<30?blk('초반 (레벨업)',sp.early)+blk('기본 운영',sp.rot):blk('기본 운영',sp.rot)+blk('초반 (레벨업)',sp.early))+blk('후반',sp.late)}
  if(sec==='learn'){const ls=C.learns.filter(l=>!l[4]||l[4]==='alliance');
    h+='<div class="card"><h3>레벨별 배우는 기술</h3><p class="note">직업 상급자에게 배워요. 흐린 건 아직 레벨이 모자라요.</p>'+groupBy(ls,l=>l[0]).filter(([lv])=>lv>=L-4&&lv<=L+6).map(([lv,arr])=>'<div class="tl'+(lv===L||lv===L-1&&L%2?' now':'')+'"><span class="lvb '+lvCls(lv,L)+'">'+lv+'</span><span class="m">'+arr.map(l=>abChip(l[1],l[5],l[3]?'새 기술':'랭크 '+l[2],lv>L)).join(' ')+'</span></div>').join('')
     +'<details class="fold"><summary>1~60 전체 보기</summary>'+groupBy(ls,l=>l[0]).map(([lv,arr])=>'<div class="tl"><span class="lvb '+lvCls(lv,L)+'">'+lv+'</span><span class="m">'+arr.map(l=>abChip(l[1],l[5],l[3]?'':'랭크 '+l[2],lv>L)).join(' ')+'</span></div>').join('')+'</details></div>'}
  if(sec==='prof')h+=profView(c);
  h+='<p class="note">출처: forg.gg 직업 가이드(Wowhead·Mobalytics 빌드를 정리한 것). 게임 업데이트로 바뀔 수 있어요.</p>';
  return h+'</div>'}
function profView(c){const sel=PROFS.find(p=>p.id===ui.pf)||PROFS[0];let h='<div class="chips">'+PROFS.map(p=>'<button class="chip'+(p===sel?' on':'')+'" data-a="pf" data-k="'+p.id+'">'+esc(p.ko)+'</button>').join('')+'</div>';
  h+='<div class="card"><h3>'+esc(sel.ko)+'</h3>'+(sel.pair?'<p class="note">같이 하면 좋은 기술: '+esc(sel.pair)+'</p>':'');
  h+='<p class="note">등급: '+PROF_RANK.map(r=>r[0]+' '+r[1]+'–'+r[2]+' ('+r[3]+')').join(' · ')+'</p>';
  if(sel.steps)h+=sel.steps.map(s=>'<div class="tl"><span class="lvb">'+s[0]+'</span><span class="m"><b>'+esc(s[2])+'</b> <span class="mute">×'+esc(s[3])+' → '+s[1]+'</span><span class="sub">'+esc(s[4])+(s[5]?' · '+esc(s[5]):'')+'</span></span></div>').join('');
  if(sel.gather)h+=sel.gather.map(g=>'<div class="tl"><span class="lvb">'+g[0]+'</span><span class="m"><b>'+esc(g[1])+'</b><span class="sub">'+esc(g[2])+'</span></span></div>').join('');
  if(sel.tips)h+='<h3>팁</h3>'+sel.tips.map(t=>'<p class="note">• '+esc(t)+'</p>').join('');
  return h+'<p class="note"><a href="'+esc(sel.src)+'" target="_blank" rel="noopener">원본 가이드 ↗</a></p></div>'}

    h+='<div class="card">'+armBox(c)+'</div>';
    h+='<button class="btn danger full" style="margin-top:14px" data-a="del">'+(ui.delAsk?'정말 지울까요? 한 번 더 누르면 지워져요':'이 캐릭터 지우기')+'</button>'}

function render(){const app=$('#app');const c=me();
  if(ui.onb||!c){if(!ui.onb)ui.onb={name:'',race:'',cls:'',spec:'',lv:1};app.innerHTML=onboard();return}
  let v='';if(ui.tab==='home')v=home(c);else if(ui.tab==='gear')v=gear(c);else if(ui.tab==='quest')v=quest(c);else if(ui.tab==='dungeon')v=dungeon(c);else v=klass(c);
  app.innerHTML=topBar(c)+v+'<p class="foot">자료: <a href="https://forg.gg/forever" target="_blank" rel="noopener">forg.gg</a> (와우헤드 포에버·Questie 정리) · 입력한 내용은 이 기기에만 저장돼요</p>'+tabs()
    +(ui.sheet?'<div class="sheet-bg" data-a="bg"><div class="sheet"><div class="grab"></div>'+(ui.sheet==='chars'?charsSheet():ui.sheet.startsWith('info:')?infoSheet(c,ui.sheet.slice(5)):ui.sheet.startsWith('q:')?questSheet(c,ui.sheet.slice(2)):slotSheet(c,ui.sheet.slice(5)))+'</div></div>':'')}
function rerender(keepScroll){const y=window.scrollY;const sh=document.querySelector('.sheet');const sy=sh?sh.scrollTop:0;render();if(keepScroll)window.scrollTo(0,y);const s2=document.querySelector('.sheet');if(s2&&keepScroll)s2.scrollTop=sy}
function setLv(c,v){v=Math.max(1,Math.min(60,parseInt(v,10)||c.lv));if(v!==c.lv){c.lv=v;save()}}

/* ===================== 이벤트 ===================== */
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,k=b.dataset.k;const c=me();
  if(a==='bg'){if(e.target===b){ui.sheet=null;ui.delAsk=0;rerender(true)}return}
  if(a==='close'){ui.sheet=null;ui.delAsk=0;rerender(true);return}
  /* 시작 화면 */
  const o=ui.onb;
  if(a==='onb-race'){o.race=k;if(o.cls&&!RACE_CLS[k].includes(o.cls)){o.cls='';o.spec=''}rerender(true);return}
  if(a==='onb-cls'){o.cls=k;o.spec='';rerender(true);return}
  if(a==='onb-spec'){o.spec=k;rerender(true);return}
  if(a==='onb-lv-'||a==='onb-lv+'){o.lv=Math.max(1,Math.min(60,(+o.lv||1)+(a==='onb-lv+'?1:-1)));rerender(true);return}
  if(a==='onb-x'){ui.onb=null;rerender();return}
  if(a==='onb-arm'){const A=ARM[k];if(A){o.arm=k;o.name=A.name;o.race=armRace(A.race);if(CL.includes(A.cls)){o.cls=A.cls;o.spec=''}o.lv=A.level||o.lv}rerender(true);return}
  if(a==='onb-go'){if(!(o.race&&o.cls&&o.spec))return;const n={id:newId(),name:(o.name||'').trim(),race:o.race,cls:o.cls,spec:o.spec,lv:Math.max(1,Math.min(60,+o.lv||1)),eq:{},fq:{},dq:{}};DB.list.push(n);DB.cur=n.id;if(o.arm){n.arm=o.arm;armApply(n,true);n.spec=o.spec}save();ui.onb=null;ui.tab='home';ui.sheet=null;render();window.scrollTo(0,0);toast('캐릭터를 만들었어요');return}
  if(!c)return;
  if(a==='tab'){ui.tab=k;ui.dg=null;render();window.scrollTo(0,0);return}
  if(a==='lv-'||a==='lv+'){setLv(c,c.lv+(a==='lv+'?1:-1));rerender(true);return}
  if(a==='chars'){ui.sheet='chars';rerender(true);return}
  if(a==='pick'){DB.cur=k;save();ui.sheet=null;ui.dg=null;ui.qz=null;render();window.scrollTo(0,0);toast('캐릭터를 바꿨어요');return}
  if(a==='add'){ui.sheet=null;ui.onb={name:'',race:c.race,cls:'',spec:'',lv:1};render();window.scrollTo(0,0);return}
  if(a==='del'){if(!ui.delAsk){ui.delAsk=1;rerender(true);return}DB.list=DB.list.filter(x=>x.id!==c.id);DB.cur=DB.list[0]?DB.list[0].id:null;save();ui.delAsk=0;ui.sheet=null;render();toast('지웠어요');return}
  if(a==='crace'){c.race=k;save();rerender(true);return}
  if(a==='armlink'){c.arm=k;armApply(c);rerender(true);return}
  if(a==='armnow'){armApply(c);rerender(true);return}
  if(a==='armoff'){delete c.arm;save();rerender(true);return}
  if(a==='ccls'){if(c.cls!==k){c.cls=k;c.spec=D_CLS[k].specs[0].id;c.eq={};save()}rerender(true);return}
  if(a==='spec'){c.spec=k;save();rerender(true);return}
  if(a==='csec'){ui.csec=k;rerender(true);return}
  if(a==='goc'){ui.tab='class';ui.csec=k;render();window.scrollTo(0,0);return}
  if(a==='pf'){ui.pf=k;rerender(true);return}
  if(a==='qmode'){ui.qmode=k;rerender(true);return}
  if(a==='qz'){ui.qz=k;rerender(true);return}
  if(a==='goz'){ui.tab='quest';ui.qmode='zone';ui.qz=k;ui.sheet=null;render();window.scrollTo(0,0);return}
  if(a==='dgo'){ui.tab='dungeon';ui.dg=k;ui.sheet=null;render();window.scrollTo(0,0);return}
  if(a==='dgback'){ui.dg=null;render();window.scrollTo(0,0);return}
  if(a==='dgf'){ui.dgf=k;rerender(true);return}
  if(a==='ifil'){ui.ifil=k;rerender(true);return}
  if(a==='slot'){ui.sheet='slot:'+k;ui.isrch='';rerender(true);return}
  if(a==='gsel'){ui.gslot=k||null;rerender(true);if(k){const p=document.querySelector('.spanel');if(p&&p.getBoundingClientRect().top>window.innerHeight-120)p.scrollIntoView({behavior:'smooth',block:'start'})}return}
  if(a==='gopanel'){ui.tab='gear';ui.gslot=k;render();const p=document.querySelector('.spanel');if(p)p.scrollIntoView({block:'start'});return}
  if(a==='qopen'){ui.sheet='q:'+k;rerender(true);const sh=document.querySelector('.sheet');if(sh)sh.scrollTop=0;return}
  if(a==='info'){ui.sheet='info:'+k;rerender(true);const sh=document.querySelector('.sheet');if(sh)sh.scrollTop=0;return}
  if(a==='gsort'){ui.gsort=k;rerender(true);return}
  if(a==='autofill'){let n=0;for(const [s] of SLOTS){if(c.eq[s]||offLocked(c,s))continue;const b=bestFor(c,s,c.lv,ui.ifil)[0];if(b){c.eq[s]=b.it.id;n++;if(s==='main'&&b.it.sl==='2h')delete c.eq.off}}save();rerender(true);toast(n?n+'칸을 추천 장비로 채웠어요':'채울 빈 칸이 없어요');return}
  if(a==='equip'){const id=+b.dataset.id;const it=IT.get(id);c.eq=c.eq||{};c.eq[k]=id;if(k==='main'&&it&&it.sl==='2h')delete c.eq.off;save();ui.sheet=null;rerender(true);toast(it.nm+' 착용');return}
  if(a==='unequip'){delete c.eq[k];save();rerender(true);return}
});
document.addEventListener('toggle',e=>{const t=e.target;if(t.classList&&t.classList.contains('qf')){if(t.open)ui.qopen=t.dataset.k;else if(ui.qopen===t.dataset.k)ui.qopen=null}},true);
document.addEventListener('change',e=>{const t=e.target;const f=t.dataset.c;if(!f)return;const c=me();
  if(f==='onb-name'){ui.onb.name=t.value;return}
  if(f==='onb-lv'){ui.onb.lv=Math.max(1,Math.min(60,parseInt(t.value)||1));rerender(true);return}
  if(!c)return;
  if(f==='lv'){setLv(c,t.value);rerender(true);return}
  if(f==='cname'){c.name=t.value.trim();save();rerender(true);return}
  if(f==='fq'){c.fq=c.fq||{};if(t.checked)c.fq[t.dataset.k]=1;else delete c.fq[t.dataset.k];save();rerender(true);return}
  if(f==='dq'){c.dq=c.dq||{};if(t.checked)c.dq[t.dataset.k]=1;else delete c.dq[t.dataset.k];save();rerender(true);return}
});
let srchT=null;
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.c==='onb-name'){ui.onb.name=t.value;return}
  if(t.dataset.c==='isrch'){ui.isrch=t.value;clearTimeout(srchT);srchT=setTimeout(()=>{const pos=t.selectionStart;rerender(true);const n=document.querySelector('[data-c=isrch]');if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(_){}}},250)}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.dataset&&(e.target.dataset.c==='lv'||e.target.dataset.c==='onb-lv'))e.target.blur()});
render();
</script>
</body></html>
