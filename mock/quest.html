<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>퀘스트 화면 시안 2</title><style>
:root{--bg:#15130f;--panel:#1f1b15;--panel2:#26211a;--line:#3a3226;--txt:#efe6d2;--mute:#a59d8c;--gold:#e8c06a;--gold2:#b8913e;--good:#7bea7b;--bad:#ff7b6b}
*{box-sizing:border-box}body{margin:0;background:#0b0a08;color:var(--txt);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;padding:18px}
h1{font-size:18px;color:var(--gold);margin:0 0 4px}.lead{color:var(--mute);font-size:13px;margin:0 0 14px}
.row3{display:flex;gap:22px;align-items:flex-start;flex-wrap:wrap}
.cap{font-size:13px;color:var(--gold);font-weight:700;margin:0 0 6px}
.ph{width:390px;height:820px;overflow:hidden;background:var(--bg);border:1px solid #333;border-radius:26px;position:relative;font-size:14px}
.ic{display:inline-block;background:#000 center/cover;border-radius:6px;flex:none}
.top{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.top .ic{width:38px;height:38px;border-radius:9px}.top b{font-size:16px}.top small{display:block;color:var(--mute);font-size:12px}
.lv{margin-left:auto;display:flex;gap:6px;align-items:center}.lv span{border:1px solid var(--line);border-radius:10px;padding:6px 10px;color:var(--mute)}.lv b{border:1.5px solid var(--gold2);color:var(--gold);border-radius:10px;padding:5px 14px;font-size:18px}
.nav{position:absolute;left:0;right:0;bottom:0;height:62px;border-top:1px solid var(--line);background:rgba(24,21,17,.98);display:flex;justify-content:space-around;align-items:center;font-size:11px;color:var(--mute)}
.nav span{display:flex;flex-direction:column;align-items:center;gap:2px}.nav img{width:24px;height:24px}.nav .on{color:var(--gold)}
.card{margin:8px 12px;padding:10px 12px;border-radius:14px;background:var(--panel);border:1px solid var(--line)}
/* 모드 탭 + 찾기 */
.mbar{display:flex;gap:6px;margin:10px 12px 0;align-items:center}
.tabs3{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;border-radius:12px;background:var(--panel);border:1px solid var(--line)}
.tabs3 span{display:flex;align-items:center;justify-content:center;gap:5px;height:34px;border-radius:9px;color:var(--mute);font-size:13px;font-weight:700}
.tabs3 .ic{width:18px;height:18px;border-radius:5px;opacity:.7}.tabs3 .on{background:#3a2c16;color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold2)}.tabs3 .on .ic{opacity:1}
.sbtn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--panel);display:flex;align-items:center;justify-content:center;font-size:17px;color:var(--mute)}
/* 지역 히어로 */
.zh{position:relative;margin:10px 12px 0;border-radius:14px;overflow:hidden;border:1px solid var(--line);height:118px;background:linear-gradient(120deg,#3a2c16,#1a1712 70%)}
.zh .bgi{position:absolute;right:-20px;top:-20px;width:170px;height:170px;border-radius:50%;background:center/cover;opacity:.35;filter:saturate(.8)}
.zh .t{position:absolute;left:14px;right:14px;bottom:10px}
.zh small{font-size:11px;color:#c9bfa8;letter-spacing:.3px}.zh h2{margin:2px 0 0;font-size:21px;text-shadow:0 2px 6px #000}
.meta{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px 0 3px;border-radius:999px;background:rgba(20,16,10,.82);border:1px solid rgba(232,192,106,.35);font-size:12px;font-weight:600;line-height:1}
.pill .ic{width:18px;height:18px;border-radius:50%}.pill.lvp{padding-left:9px;color:#8bd37a;border-color:rgba(139,211,122,.5)}
.ring{position:absolute;right:14px;top:12px;width:58px;height:58px;border-radius:50%;background:conic-gradient(#e8c06a 0 22%,#2a251d 22% 100%);display:flex;align-items:center;justify-content:center}
.ring b{width:46px;height:46px;border-radius:50%;background:#1a1712;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:15px;line-height:1}.ring b small{font-size:9.5px;color:var(--mute);margin-top:2px}
/* 진행 줄 */
.goal{display:flex;align-items:center;gap:10px}
.goal .ic{width:34px;height:34px;border-radius:9px}.goal .m{flex:1;min-width:0}.goal b{font-size:13.5px}.goal small{display:block;font-size:11.5px;color:var(--mute)}
.bar{height:6px;border-radius:3px;background:#2a251d;margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#8a7440,#e8c06a)}
.goal .x{flex:none;font-size:12px;color:var(--good);font-weight:800}
/* 거점 타임라인 */
.tlh{display:flex;align-items:center;gap:8px;margin:12px 14px 6px}.tlh b{font-size:15px}.tlh small{color:var(--mute);font-size:12px}.tlh span{margin-left:auto;font-size:11.5px;color:var(--mute);border:1px solid var(--line);border-radius:8px;padding:3px 8px}
.tl{position:relative;margin:0 12px 0 14px;padding-left:30px}
.tl::before{content:'';position:absolute;left:21px;top:20px;bottom:10px;width:2px;background:linear-gradient(#b8913e,#5d4a28)}
.hub{position:relative;margin:0 0 9px;border-radius:14px;background:var(--panel);border:1px solid var(--line);padding:9px 12px 9px 40px}
.hub .nd{position:absolute;left:-23px;top:9px;width:42px;height:42px;border-radius:50%;background:#000 center/cover;border:2px solid var(--gold2);box-shadow:0 0 0 3px var(--bg)}
.hub .no{position:absolute;left:8px;top:36px;width:20px;height:20px;border-radius:50%;background:var(--gold2);color:#1a140a;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;border:2px solid var(--bg)}
.hub .hn{display:flex;align-items:center;gap:6px}.hub .hn b{font-size:15px}.hub .hn small{font-size:11.5px;color:var(--mute)}
.hub .cts{margin-left:auto;display:flex;gap:4px}
.ct{display:inline-flex;align-items:center;gap:3px;height:22px;padding:0 7px 0 3px;border-radius:7px;font-size:11px;font-weight:700;border:1px solid;line-height:1}
.ct .ic{width:16px;height:16px;border-radius:4px}.ct.get{color:#ffe08a;border-color:#c9a227;background:rgba(201,162,39,.15)}.ct.turn{color:#a9dcff;border-color:#3f8fcf;background:rgba(63,143,207,.16)}
.hub.open{border-color:var(--gold2)}.hub.sm{padding-top:8px;padding-bottom:8px}
.ql{margin-top:8px;display:flex;flex-direction:column;gap:5px}
.qr{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:10px;background:var(--bg);border:1px solid var(--line)}
.qr .ck{width:22px;height:22px;border-radius:50%;border:2px solid #5a4f3c;flex:none}.qr .ck.on{background:#2f5a24;border-color:#7bea7b}
.qr .ic{width:28px;height:28px;border-radius:7px}
.qr .m{flex:1;min-width:0;line-height:1.3}.qr b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.qr small{display:block;font-size:11px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qr .r{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.lvq{font-size:11px;font-weight:800;border-radius:6px;padding:1px 6px;border:1px solid}.lvq.g{color:#8bd37a;border-color:#4f7a3c}.lvq.y{color:#ffe08a;border-color:#c9a227}.lvq.o{color:#ffb44a;border-color:#c46a2a}
.xp{font-size:10.5px;color:#b9a7e8}
.chn{display:inline-flex;align-items:center;gap:3px;margin-top:3px;font-size:10.5px;color:#9fd2ff;background:#1d3a52;border-radius:6px;padding:1px 6px}
.qr.done{opacity:.5}.qr.done b{text-decoration:line-through}
.more2{display:block;text-align:center;margin-top:6px;font-size:12px;color:var(--mute)}
/* 펼친 퀘스트 */
.qc{margin:8px 12px;border-radius:14px;background:var(--panel);border:1px solid var(--gold2);overflow:hidden}
.qc .h{display:flex;align-items:center;gap:9px;padding:10px 12px;background:linear-gradient(90deg,#3a2c16,var(--panel))}
.qc .h .ic{width:36px;height:36px;border-radius:9px}.qc .h .m{flex:1}.qc .h b{font-size:16px;display:block}.qc .h small{font-size:11.5px;color:var(--mute)}
.tg{display:flex;gap:5px;padding:2px 12px 8px;flex-wrap:wrap}.tg span{display:inline-flex;align-items:center;height:20px;font-size:10.5px;padding:0 7px;border-radius:6px;background:var(--bg);color:var(--mute);border:1px solid var(--line)}.tg .f{background:#1f2b4a;color:#9fd2ff;border-color:#2c4270}.tg .c{background:#1d3a52;color:#9fd2ff;border-color:#2c5a7a}
.obj{margin:0 12px 8px;padding:9px 11px;border-radius:10px;background:rgba(232,192,106,.08);border:1px solid rgba(232,192,106,.3)}
.obj b{display:block;font-size:12px;color:var(--gold);margin-bottom:4px}.obj .o{display:flex;align-items:center;gap:8px;font-size:13px;margin:4px 0}.obj .o .ic{width:24px;height:24px}.obj .o em{margin-left:auto;font-style:normal;font-size:12px;color:var(--mute)}
.qs{position:relative;margin:0 12px;padding-left:22px}
.qs::before{content:'';position:absolute;left:8px;top:12px;bottom:14px;width:2px;background:#5d4a28}
.qst{position:relative;display:flex;gap:8px;align-items:flex-start;padding:6px 0;font-size:12.5px;line-height:1.45}
.qst::before{content:attr(data-n);position:absolute;left:-22px;top:6px;width:18px;height:18px;border-radius:50%;background:var(--bg);border:2px solid var(--gold2);color:var(--gold);font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center}
.qst .k{flex:none;width:44px;font-size:11px;font-weight:700;white-space:nowrap}.qst .k.g{color:#ffd65a}.qst .k.o{color:#ffb44a}.qst .k.r{color:#7ec8ff}
.qst small{color:var(--mute)}.qst .mp{margin-left:auto;flex:none;font-size:11px;color:var(--gold);border:1px solid var(--gold2);border-radius:7px;padding:1px 7px}
.rw{margin:8px 12px;padding:9px 11px;border-radius:10px;background:var(--bg);border:1px solid var(--line)}
.rw .hd{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mute)}.rw .hd b{color:#b9a7e8}.rw .hd .gd{color:#ffd65a}
.rws{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.rwi{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center;padding:6px 3px;border-radius:9px;border:1px solid var(--line)}
.rwi .ic{width:40px;height:40px;border-radius:9px;border:2px solid #3a7bd5}.rwi .ic.u{border-color:#2fbf4f}
.rwi span{font-size:10.5px;line-height:1.2;color:#cfc6b3;height:25px;overflow:hidden}.rwi small{font-size:10px;color:#8bd37a}
.rwi .g{position:absolute;top:-6px;right:-3px;background:#24361d;border:1px solid #4f7a3c;color:var(--good);font-weight:800;font-size:10.5px;border-radius:7px;padding:0 5px;font-style:normal}
.rwi.best{border-color:#4f7a3c;background:rgba(60,120,50,.12)}
.chain{display:flex;align-items:center;gap:4px;margin:6px 12px 2px;font-size:11.5px;color:var(--mute)}.chain i{width:16px;height:6px;border-radius:3px;background:#2a251d}.chain i.on{background:#e8c06a}.chain i.cur{background:#e8c06a;box-shadow:0 0 0 2px rgba(232,192,106,.35)}
.btns{display:flex;gap:6px;padding:8px 12px 12px}.btns span{flex:1;text-align:center;height:38px;display:flex;align-items:center;justify-content:center;font-size:13px;border-radius:10px;border:1px solid var(--line);color:var(--mute);font-weight:700}.btns .on{border-color:#4f7a3c;color:var(--good);background:#1d2a17}.btns .pri{border-color:var(--gold2);color:var(--gold);background:#3a2c16}
/* 도우미 타일 */
.hg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 12px}
.ht{padding:10px;border-radius:14px;background:var(--panel);border:1px solid var(--line);min-height:96px}
.ht .hd{display:flex;align-items:center;gap:7px}.ht .hd .ic{width:26px;height:26px}.ht .hd b{font-size:13.5px}
.ht p{margin:6px 0 0;font-size:11.5px;color:var(--mute);line-height:1.45}.ht p b{color:var(--txt)}
.ht .ics{display:flex;gap:4px;margin-top:7px}.ht .ics .ic{width:24px;height:24px}
.ht .new{font-size:10px;color:#1a140a;background:#ffd65a;border-radius:5px;padding:0 4px;font-weight:800;margin-left:auto}
.ht.hot{border-color:var(--gold2);background:linear-gradient(160deg,#3a2c16,var(--panel) 70%)}
/* 1-60 길 */
.track{position:relative;margin:4px 12px 10px;height:58px}
.track .ln{position:absolute;left:4px;right:4px;top:22px;height:4px;border-radius:2px;background:#2a251d}.track .ln i{display:block;width:55%;height:100%;background:linear-gradient(90deg,#5d4a28,#e8c06a);border-radius:2px}
.track .st{position:absolute;top:10px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:3px}
.track .st .ic{width:26px;height:26px;border-radius:50%;border:2px solid #5d4a28}.track .st.on .ic{border-color:var(--gold);box-shadow:0 0 0 3px rgba(232,192,106,.25);width:30px;height:30px}
.track .st small{font-size:9.5px;color:var(--mute);white-space:nowrap}.track .st.on small{color:var(--gold);font-weight:800}
/* 지역 목록 */
.cont{display:flex;gap:6px;margin:10px 12px 4px;overflow:hidden}.cont span{flex:none;display:inline-flex;align-items:center;gap:5px;height:32px;padding:0 11px 0 4px;border-radius:999px;border:1px solid var(--line);font-size:12.5px;color:var(--mute)}
.cont .ic{width:24px;height:24px;border-radius:50%}.cont .on{border-color:var(--gold2);color:var(--gold);background:#3a2c16}
.sec{margin:12px 14px 6px;font-size:13px;font-weight:800;color:var(--gold)}
.zf{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 12px}
.zc{position:relative;padding:10px;border-radius:14px;border:1px solid var(--gold2);background:linear-gradient(160deg,#3a2c16,var(--panel) 75%);overflow:hidden}
.zc .ic{width:40px;height:40px;border-radius:10px}.zc b{display:block;font-size:14px;margin-top:6px}.zc small{display:block;font-size:11px;color:var(--mute)}
.zc .hot{display:inline-block;margin-top:5px;font-size:11px;font-weight:800;color:#1a140a;background:#ffd65a;border-radius:6px;padding:1px 6px}
.rb{position:relative;height:6px;border-radius:3px;background:#2a251d;margin-top:7px}.rb i{position:absolute;top:0;bottom:0;border-radius:3px;background:#5d4a28}.rb em{position:absolute;top:-3px;width:3px;height:12px;border-radius:2px;background:#7bea7b;box-shadow:0 0 4px #7bea7b}
.zl{margin:6px 12px;display:flex;flex-direction:column;gap:5px}
.zr{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:12px;background:var(--panel);border:1px solid var(--line)}
.zr .ic{width:34px;height:34px;border-radius:9px}.zr .m{flex:1;min-width:0}.zr b{font-size:13.5px}.zr small{display:block;font-size:11px;color:var(--mute)}
.zr .lvr{flex:none;width:86px}.zr .lvr span{display:block;text-align:right;font-size:11px;color:var(--mute)}.zr.past{opacity:.5}

/* v2 */
.ph{height:860px}
.srch{margin:10px 12px 0;display:flex;align-items:center;gap:8px;height:44px;padding:0 12px;border-radius:12px;background:var(--panel);border:1px solid var(--line);color:var(--mute);font-size:14px}
.srch .ic{width:20px;height:20px;border-radius:5px;opacity:.8}.srch b{color:var(--txt);font-weight:600}.srch .x{margin-left:auto;font-size:13px}
.srch.on{border-color:var(--gold2);box-shadow:0 0 0 3px rgba(232,192,106,.12)}
.qch{display:flex;gap:6px;margin:8px 12px 0;overflow:hidden}
.qch span{flex:none;display:inline-flex;align-items:center;gap:4px;height:28px;padding:0 10px 0 4px;border-radius:999px;border:1px solid var(--line);font-size:12px;color:var(--mute);background:var(--panel)}
.qch .ic{width:20px;height:20px;border-radius:50%}.qch .on{border-color:var(--gold2);color:var(--gold);background:#3a2c16}.qch em{font-style:normal;font-weight:800;color:var(--txt)}
.qch .tn{border-color:#3f8fcf;color:#a9dcff;background:rgba(63,143,207,.12)}
.mt2{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin:8px 12px 0;padding:4px;border-radius:12px;background:var(--panel);border:1px solid var(--line)}
.mt2 span{display:flex;align-items:center;justify-content:center;gap:5px;height:32px;border-radius:9px;color:var(--mute);font-size:13px;font-weight:700}.mt2 .ic{width:18px;height:18px;opacity:.7}.mt2 .on{background:#3a2c16;color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold2)}.mt2 .on .ic{opacity:1}
/* 레벨 막대 (퀘스트 조각) */
.xpb{margin:8px 12px 0;padding:10px 12px;border-radius:14px;background:var(--panel);border:1px solid var(--line)}
.xpb .t{display:flex;align-items:baseline;gap:6px;font-size:12px;color:var(--mute)}.xpb .t b{font-size:15px;color:var(--txt)}.xpb .t .g{margin-left:auto;color:#b9a7e8;font-weight:800}
.seg{display:flex;height:10px;margin-top:7px;border-radius:5px;overflow:hidden;background:#2a251d;gap:2px}
.seg i{display:block;height:100%}.seg .d{background:#8a7440}.seg .p{background:linear-gradient(90deg,#6b56b8,#9b86e8)}.seg .p2{background:#5a4a96}
.xpb .lg{display:flex;justify-content:space-between;margin-top:5px;font-size:10.5px;color:var(--mute)}.xpb .lg b{color:#c8b8ff}
/* 동선 지도 */
.mapc{margin:8px 12px 0;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--panel)}
.mapc .hd{display:flex;align-items:center;gap:6px;padding:8px 12px}.mapc .hd b{font-size:14px}.mapc .hd small{color:var(--mute);font-size:11.5px}.mapc .hd span{margin-left:auto;font-size:11.5px;color:var(--gold);border:1px solid var(--gold2);border-radius:8px;padding:2px 8px}
.mapc svg{display:block;width:100%;height:auto}
/* 단계 */
.stp{position:relative;margin:0 12px 0 14px;padding-left:30px}
.stp::before{content:'';position:absolute;left:12px;top:16px;bottom:16px;width:2px;background:linear-gradient(#b8913e,#5d4a28)}
.sg{position:relative;margin:0 0 8px;border-radius:14px;background:var(--panel);border:1px solid var(--line);padding:9px 11px}
.sg .n{position:absolute;left:-30px;top:9px;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;border:2px solid;box-shadow:0 0 0 3px var(--bg);background:var(--bg)}
.sg.get .n{border-color:#c9a227;color:#ffe08a}.sg.do .n{border-color:#c46a2a;color:#ffc08a}.sg.turn .n{border-color:#3f8fcf;color:#a9dcff}
.sg.cur{border-color:var(--gold2);box-shadow:0 0 14px rgba(232,192,106,.12)}.sg.dn{opacity:.5}
.sg .h{display:flex;align-items:center;gap:7px}.sg .h .k{flex:none;height:20px;display:inline-flex;align-items:center;padding:0 7px;border-radius:6px;font-size:11px;font-weight:800;border:1px solid}
.sg.get .k{color:#ffe08a;border-color:#c9a227;background:rgba(201,162,39,.15)}.sg.do .k{color:#ffc08a;border-color:#c46a2a;background:rgba(196,106,42,.15)}.sg.turn .k{color:#a9dcff;border-color:#3f8fcf;background:rgba(63,143,207,.15)}
.sg .h b{font-size:14px}.sg .h small{margin-left:auto;font-size:11px;color:var(--mute)}
.sg .w{margin-top:6px;display:flex;flex-direction:column;gap:4px}
.ob{display:flex;align-items:center;gap:7px;font-size:12.5px}
.ob .ic{width:24px;height:24px;border-radius:6px}.ob .m{flex:1;min-width:0;line-height:1.3}.ob .m small{display:block;color:var(--mute);font-size:10.5px}
.ob .cnt{flex:none;display:flex;align-items:center;gap:4px}.ob .cnt i{font-style:normal;width:24px;height:24px;border-radius:7px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--mute);font-size:14px}.ob .cnt b{min-width:38px;text-align:center;font-size:12.5px;font-variant-numeric:tabular-nums}

.ob.ok b{color:#7bea7b}

 +'· <b>퀘스트별이 아니라 장소별 단계</b>: 한 곳에서 같이 할 것을 묶어요(사티로스에서 발톱·뿔 같이, 켄타우로스 마을에서 귀걸이·평판 2개 같이). 단계마다 몹 이름·레벨, 숫자 칸(−/+)으로 몇 개 모았는지 세기.<br>'
 +'· <b>화면 아래 고정 추적 줄</b>: 지금 단계와 「발톱 3/10」, + 한 번 누르면 하나 셈. 스크롤해도 따라와요.<br>'
 +'· <b>퀘스트 상세</b>: 할 일 숫자 세기 · 잡을 몹 목록 · 작은 지도(받는 곳·잡는 곳) · 연계 전체 줄(지금 위치, 끝까지 하면 경험치) · 보상·버튼.<br>'
 +'· 「지도」 탭은 동선 지도 「크게」로 합치고, 탭은 <b>레벨업 동선 / 지역 목록</b> 두 개로.<br>'+'· 그대로 가져갈 것: 레벨업 도우미 2×2 타일, 1–60 길, 지역 탭(시안 1의 ③④).';
