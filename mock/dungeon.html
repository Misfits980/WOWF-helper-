<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>던전 화면 시안</title>
<style>
:root{--bg:#15130f;--panel:#1f1b15;--panel2:#26211a;--line:#3a3226;--txt:#efe6d2;--mute:#a59d8c;--gold:#e8c06a;--gold2:#b8913e;--good:#7bea7b;--bad:#ff7b6b}
*{box-sizing:border-box}body{margin:0;background:#0b0a08;color:var(--txt);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;padding:18px}
h1{font-size:18px;color:var(--gold);margin:0 0 4px}.lead{color:var(--mute);font-size:13px;margin:0 0 14px}
.row3{display:flex;gap:22px;align-items:flex-start;flex-wrap:wrap}
.cap{font-size:13px;color:var(--gold);font-weight:700;margin:0 0 6px}
.ph{width:390px;height:800px;overflow:hidden;background:var(--bg);border:1px solid #333;border-radius:26px;position:relative;font-size:14px}
.ic{display:inline-block;background:#000 center/cover;border-radius:6px;flex:none}
.top{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.top .ic{width:38px;height:38px;border-radius:9px}.top b{font-size:16px}.top small{display:block;color:var(--mute);font-size:12px}
.lv{margin-left:auto;display:flex;gap:6px;align-items:center}.lv span{border:1px solid var(--line);border-radius:10px;padding:6px 10px;color:var(--mute)}.lv b{border:1.5px solid var(--gold2);color:var(--gold);border-radius:10px;padding:5px 14px;font-size:18px}
.strip{display:flex;gap:8px;padding:10px 12px;overflow:hidden;border-bottom:1px solid var(--line);background:linear-gradient(#1b1f26,#15130f)}
.chipd{flex:none;display:flex;align-items:center;gap:8px;padding:5px 12px 5px 5px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
.chipd.on{border-color:#6ea0ff;box-shadow:0 0 0 1px #6ea0ff inset}.chipd .ic{width:34px;height:34px}.chipd .dimg{width:44px;height:44px;border-radius:9px;object-fit:cover;background:#2a2418;flex:none}.chipd b{font-size:13.5px;display:block}.chipd small{font-size:11px;color:#8bd37a}
/* 히어로 */
.hero{position:relative;height:150px;margin:10px 12px 0;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#222 center/cover}
.hero::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05) 20%,rgba(10,8,5,.92) 92%)}
.hero .t{position:absolute;left:14px;right:14px;bottom:10px;z-index:2}
.hero h2{margin:0;font-size:21px;text-shadow:0 2px 6px #000}.hero .en{font-size:11px;color:#c9bfa8}
.hero .meta{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px 3px 4px;border-radius:999px;background:rgba(20,16,10,.82);border:1px solid rgba(232,192,106,.35);font-size:12px;font-weight:600}
.pill .ic{width:18px;height:18px;border-radius:50%}.pill.lvp{padding-left:9px;color:#8bd37a;border-color:rgba(139,211,122,.5)}
/* 탭 */
.tabs3{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin:10px 12px;padding:4px;border-radius:12px;background:var(--panel);border:1px solid var(--line)}
.tabs3 button{display:flex;align-items:center;justify-content:center;gap:6px;padding:7px 4px;border:0;border-radius:9px;background:none;color:var(--mute);font-size:13px;font-weight:600;font-family:inherit}
.tabs3 .ic{width:20px;height:20px;border-radius:5px;opacity:.7}.tabs3 em{font-style:normal;background:#3a2c16;color:var(--gold);border-radius:8px;padding:0 6px;font-size:11.5px}
.tabs3 .on{background:#3a2c16;color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold2)}.tabs3 .on .ic{opacity:1}
/* 파티 준비 */
.card{margin:8px 12px;padding:10px 12px;border-radius:14px;background:var(--panel);border:1px solid var(--line)}
.ready{display:flex;align-items:center;gap:8px}
.roles{display:flex;gap:4px;padding:3px;border-radius:12px;background:var(--bg);border:1px solid var(--line)}
.roles span{width:40px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;opacity:.5}
.roles span img{width:24px;height:24px}.roles .on{opacity:1;background:#2a3a24;box-shadow:inset 0 0 0 1.5px #7bea7b}
.go{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;height:44px;border-radius:12px;border:1px solid var(--gold2);background:linear-gradient(#5a4320,#3b2c15);color:var(--gold);font-weight:800;font-size:15px}
.go .ic{width:22px;height:22px}
.prog{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:12px;color:var(--mute)}
.prog .bar{flex:1;height:6px;border-radius:3px;background:#2a251d}.prog .bar i{display:block;width:0;height:100%}
.sum{font-size:13px;line-height:1.55;color:#d9cfba;margin:0}.sum b{color:var(--gold)}
.more{color:var(--gold);font-size:12px}
/* 노릴 템 */
.hd{display:flex;align-items:center;gap:7px;margin-bottom:8px}.hd .ic{width:22px;height:22px}.hd b{font-size:14px;color:var(--gold)}.hd small{margin-left:auto;color:var(--mute);font-size:11.5px}
.loot{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.lt{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.lt .ic{width:50px;height:50px;border-radius:10px;border:2px solid #3a7bd5;position:relative}
.lt .ic.u{border-color:#2fbf4f}
.lt .g{margin-top:-14px;z-index:2;background:#24361d;border:1px solid #4f7a3c;color:var(--good);font-weight:800;font-size:11px;border-radius:7px;padding:0 5px}
.lt span{font-size:10.5px;line-height:1.2;color:#cfc6b3;height:26px;overflow:hidden}
/* 주의 */
.warn{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:12px;margin:8px 12px;background:rgba(232,180,60,.1);border:1px solid rgba(232,180,60,.4);color:#f2c96b;font-size:13px;font-weight:600}
.warn .ic{width:22px;height:22px}.warn i{margin-left:auto;font-style:normal;color:var(--mute)}
/* 타임라인 */
.tlh{display:flex;align-items:center;gap:8px;margin:12px 14px 6px}.tlh b{font-size:15px}.tlh small{color:var(--mute);font-size:12px}.tlh span{margin-left:auto;font-size:11.5px;color:var(--mute);border:1px solid var(--line);border-radius:8px;padding:3px 8px}
.tl{position:relative;margin:0 12px 0 14px;padding-left:30px}
.tl::before{content:'';position:absolute;left:23px;top:20px;bottom:20px;width:2px;background:linear-gradient(#b8913e,#5d4a28)}
.bn{position:relative;margin:0 0 10px;border-radius:14px;background:var(--panel);border:1px solid var(--line);padding:10px 12px 10px 48px}
.bn .por{position:absolute;left:-22px;top:8px;width:52px;height:52px;border-radius:50%;background:#000 center/cover;border:2px solid var(--gold2);box-shadow:0 0 0 3px var(--bg)}
.bn .no{position:absolute;left:18px;top:44px;width:20px;height:20px;border-radius:50%;background:var(--gold2);color:#1a140a;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;border:2px solid var(--bg)}
.bn .nm{display:flex;align-items:center;gap:6px}.bn .nm b{font-size:15.5px}.bn .nm .lvb{font-size:11px;color:#8bd37a;border:1px solid #4f7a3c;border-radius:6px;padding:0 5px}
.bn .ck{margin-left:auto;width:24px;height:24px;border-radius:7px;border:2px solid #5a4f3c}
.tags{display:flex;gap:5px;margin-top:5px;flex-wrap:wrap}.tags span{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:#cfc6b3;background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:1px 7px 1px 2px}.tags .ic{width:16px;height:16px;border-radius:4px}
.bn.open{border-color:var(--gold2)}
.skill{margin-top:8px;padding:8px 10px;border-radius:10px;background:rgba(150,60,40,.13);border:1px solid rgba(200,90,60,.35);font-size:12.5px;line-height:1.5}.skill b{display:flex;align-items:center;gap:5px;color:#f0a27a;font-size:12px;margin-bottom:2px}.skill b .ic{width:16px;height:16px}
.me{margin-top:6px;padding:8px 10px;border-radius:10px;background:rgba(90,160,80,.12);border:1px solid #4f7a3c;font-size:12.5px;line-height:1.5}.me b{display:flex;align-items:center;gap:5px;color:#9fdf8a;font-size:12px;margin-bottom:2px}.me img{width:16px;height:16px}
.drops{display:flex;gap:6px;margin-top:8px;align-items:center}.drops .ic{width:30px;height:30px;border-radius:7px;border:1.5px solid #3a7bd5}.drops .ic.u{border-color:#2fbf4f}.drops small{font-size:11px;color:var(--mute);margin-left:2px}
.obj{position:relative;display:flex;align-items:center;gap:8px;margin:0 0 10px;padding:6px 10px 6px 18px;font-size:12.5px;color:#cfc6b3}
.obj::before{content:'';position:absolute;left:-12px;top:50%;width:10px;height:10px;margin-top:-5px;border-radius:50%;background:#5d4a28;border:2px solid var(--bg)}
.obj .ic{width:22px;height:22px;border-radius:5px}.obj em{font-style:normal;color:var(--mute);font-size:11px}.obj .fa{font-size:10.5px;padding:0 5px;border-radius:5px;background:#1d3a52;color:#9fd2ff}
/* 템 탭 */
.flt{display:flex;gap:6px;margin:4px 12px 4px}.flt span{font-size:12.5px;padding:5px 11px;border-radius:999px;border:1px solid var(--line);color:var(--mute)}.flt .on{border-color:var(--gold2);color:var(--gold);background:#3a2c16}
.bs{margin:8px 12px;border-radius:14px;background:var(--panel);border:1px solid var(--line);padding:10px 12px}
.bs .h{display:flex;align-items:center;gap:8px}.bs .h .por{width:38px;height:38px;border-radius:50%;background:#000 center/cover;border:2px solid var(--gold2)}.bs .h b{font-size:14.5px}.bs .h small{display:block;font-size:11.5px;color:var(--mute)}
.ig{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.it{display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center;padding:6px 2px;border-radius:10px;background:var(--bg);border:1px solid var(--line)}
.it .ic{width:42px;height:42px;border-radius:9px;border:2px solid #3a7bd5}.it .ic.u{border-color:#2fbf4f}.it b{font-size:10.5px;line-height:1.2;height:25px;overflow:hidden;color:#9fc4ff}.it b.u{color:#7bea7b}.it small{font-size:10px;color:var(--mute)}
.it .g{font-size:11px;font-weight:800;color:var(--good)}.it.best{border-color:#4f7a3c;box-shadow:inset 0 0 0 1px rgba(123,234,123,.3)}.it .no{color:var(--mute);font-size:10.5px}
.nav{position:absolute;left:0;right:0;bottom:0;height:62px;border-top:1px solid var(--line);background:rgba(24,21,17,.98);display:flex;justify-content:space-around;align-items:center;font-size:11px;color:var(--mute)}
.nav span{display:flex;flex-direction:column;align-items:center;gap:2px}.nav img{width:24px;height:24px}.nav .on{color:var(--gold)}
.notes{max-width:1240px;margin-top:16px;font-size:13px;line-height:1.7;color:#cfc6b3}.notes b{color:var(--gold)}

/* 템 v2 */
.lsum{display:flex;align-items:center;gap:10px;margin:8px 12px;padding:10px 12px;border-radius:14px;background:linear-gradient(90deg,rgba(60,120,50,.22),var(--panel) 70%);border:1px solid #4f7a3c}
.lsum .ic{width:44px;height:44px;border-radius:10px;border:2px solid #3a7bd5}.lsum b{display:block;font-size:14px}.lsum small{display:block;font-size:11.5px;color:var(--mute)}.lsum .g{margin-left:auto;font-size:20px;font-weight:900;color:var(--good)}
.flt2{display:flex;gap:6px;margin:6px 12px}.flt2 span{font-size:12.5px;padding:5px 11px;border-radius:999px;border:1px solid var(--line);color:var(--mute);display:inline-flex;align-items:center;gap:4px}.flt2 .on{border-color:var(--gold2);color:var(--gold);background:#3a2c16}.flt2 .sel{margin-left:auto}
.bs2{margin:8px 12px;border-radius:14px;background:var(--panel);border:1px solid var(--line);overflow:hidden}
.bs2 .h{display:flex;align-items:center;gap:9px;padding:9px 12px;background:linear-gradient(90deg,#2a2216,var(--panel))}
.bs2 .h .por{width:36px;height:36px;border-radius:50%;background:#000 center/cover;border:2px solid var(--gold2);flex:none}.bs2 .h b{font-size:14.5px}.bs2 .h small{display:block;font-size:11px;color:var(--mute)}.bs2 .h .no{width:18px;height:18px;border-radius:50%;background:var(--gold2);color:#1a140a;font-size:10.5px;font-weight:800;display:flex;align-items:center;justify-content:center}
.bs2 .h .cnt{margin-left:auto;font-size:11px;color:var(--good);border:1px solid #4f7a3c;border-radius:7px;padding:1px 7px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:6px 10px 10px}
.ci{position:relative;display:flex;align-items:center;gap:7px;padding:6px 7px;border-radius:10px;background:var(--bg);border:1px solid var(--line)}
.ci .ic{width:36px;height:36px;border-radius:8px;border:2px solid #3a7bd5}.ci .ic.u{border-color:#2fbf4f}
.ci .m{min-width:0;flex:1}.ci b{display:block;font-size:12px;line-height:1.25;color:#9fc4ff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ci b.u{color:#7bea7b}.ci small{font-size:10.5px;color:var(--mute)}
.ci .g{position:absolute;top:-6px;right:-4px;background:#24361d;border:1px solid #4f7a3c;color:var(--good);font-weight:800;font-size:10.5px;border-radius:7px;padding:0 5px}
.ci.best{border-color:#4f7a3c;box-shadow:inset 0 0 0 1px rgba(123,234,123,.3)}.ci.no{opacity:.45}
.trash{display:flex;align-items:center;gap:8px;margin:8px 12px;padding:10px 12px;border-radius:14px;background:var(--panel);border:1px dashed var(--line);font-size:13px;color:#cfc6b3}.trash .ics{display:flex;gap:3px;margin-left:auto}.trash .ics .ic{width:22px;height:22px;border-radius:5px;opacity:.85}
/* 퀘스트 */
.qtop{display:flex;align-items:center;gap:8px;margin:8px 12px;padding:10px 12px;border-radius:14px;background:var(--panel);border:1px solid var(--line)}
.qtop .ic{width:30px;height:30px}.qtop b{font-size:14px}.qtop small{display:block;font-size:11.5px;color:var(--mute)}.qtop .ok{margin-left:auto;font-size:12px;color:var(--good);border:1px solid #4f7a3c;border-radius:8px;padding:3px 8px}
.qc{margin:8px 12px;border-radius:14px;background:var(--panel);border:1px solid var(--gold2);overflow:hidden}
.qc .h{display:flex;align-items:center;gap:8px;padding:10px 12px;background:linear-gradient(90deg,#3a2c16,var(--panel))}
.qc .h img{width:22px;height:22px}.qc .h b{font-size:15.5px;flex:1}.qc .h .lvb{font-size:11px;color:#8bd37a;border:1px solid #4f7a3c;border-radius:6px;padding:0 6px}
.qc .tg{display:flex;gap:5px;padding:0 12px 6px}.qc .tg span{font-size:10.5px;padding:1px 7px;border-radius:6px;background:#1d3a52;color:#9fd2ff}.qc .tg .f{background:#1f2b4a}.qc .tg .m{background:var(--bg);color:var(--mute);border:1px solid var(--line)}
.qs{position:relative;margin:2px 12px 0 12px;padding-left:22px}
.qs::before{content:'';position:absolute;left:8px;top:10px;bottom:16px;width:2px;background:#5d4a28}
.qst{position:relative;display:flex;gap:8px;align-items:flex-start;padding:6px 0;font-size:12.5px;line-height:1.45}
.qst::before{content:attr(data-n);position:absolute;left:-22px;top:6px;width:18px;height:18px;border-radius:50%;background:var(--bg);border:2px solid var(--gold2);color:var(--gold);font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center}
.qst .k{flex:none;width:46px;font-size:11px;font-weight:700;white-space:nowrap}.qst .k.g{color:#ffd65a}.qst .k.o{color:#ffb44a}.qst .k.r{color:#7ec8ff}
.qst small{color:var(--mute)}.qst .mp{margin-left:auto;flex:none;font-size:11px;color:var(--gold);border:1px solid var(--gold2);border-radius:7px;padding:1px 7px}
.qrw{display:flex;align-items:center;gap:8px;margin:6px 12px 10px;padding:8px 10px;border-radius:10px;background:var(--bg);border:1px solid var(--line)}
.qrw .ic{width:38px;height:38px;border-radius:8px;border:2px solid #3a7bd5}.qrw b{display:block;font-size:13px;color:#9fc4ff}.qrw small{font-size:11px;color:var(--mute)}.qrw .g{margin-left:auto;font-size:13px;font-weight:800;color:var(--good)}
.qck{display:flex;gap:6px;padding:0 12px 12px}.qck span{flex:1;text-align:center;font-size:12.5px;padding:7px;border-radius:9px;border:1px solid var(--line);color:var(--mute)}.qck .on{border-color:#4f7a3c;color:var(--good);background:#1d2a17}
.qx{margin:8px 12px;padding:10px 12px;border-radius:14px;background:rgba(110,140,220,.08);border:1px solid rgba(110,140,220,.35);font-size:12.5px;line-height:1.5;color:#cfd6ee}.qx b{color:#9db4f2}.qx .ws{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}.qx .ws span{font-size:11px;padding:2px 8px;border-radius:7px;border:1px solid rgba(110,140,220,.4)}.qx .ws .on{background:rgba(110,140,220,.25);color:#e0e8ff}


/* 보스 기술 강조 */
.tags .k{border-width:1px;font-weight:700}.k.dis{color:#d7b4ff;border-color:#8a5cd6;background:rgba(138,92,214,.16)}.k.int{color:#ffe08a;border-color:#c9a227;background:rgba(201,162,39,.15)}.k.av{color:#a9dcff;border-color:#3f8fcf;background:rgba(63,143,207,.16)}.k.add{color:#ffc08a;border-color:#c46a2a;background:rgba(196,106,42,.16)}.k.dz{color:#ffb0a6;border-color:#d0463a;background:rgba(208,70,58,.2)}
.lgd{display:flex;gap:4px;flex-wrap:wrap;margin:0 12px 8px}.lgd span{font-size:10.5px;padding:1px 7px;border-radius:6px;border:1px solid}
.dzb{display:flex;gap:8px;align-items:flex-start;margin-top:8px;padding:8px 10px;border-radius:10px;background:linear-gradient(90deg,rgba(208,70,58,.28),rgba(208,70,58,.08));border:1px solid #d0463a;box-shadow:0 0 12px rgba(208,70,58,.25);font-size:12.5px;line-height:1.45}
.dzb .ic{width:32px;height:32px;border-radius:7px;border:2px solid #d0463a;flex:none}.dzb b{display:block;color:#ffb0a6;font-size:13px}.dzb .ph5{display:inline-block;margin-left:4px;font-size:10.5px;color:#fff;background:#d0463a;border-radius:5px;padding:0 5px;vertical-align:1px}
.skl{margin-top:8px;display:flex;flex-direction:column;gap:5px}
.skr{display:flex;gap:8px;align-items:center;padding:6px 8px 6px 7px;border-radius:9px;background:var(--bg);border:1px solid var(--line);border-left:3px solid var(--line)}
.skr .ic{width:28px;height:28px;border-radius:6px;flex:none}.skr .m{flex:1;min-width:0}.skr b{font-size:12.5px}.skr small{display:block;font-size:11px;color:var(--mute);line-height:1.35}
.skr .k{flex:none;font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:6px;border:1px solid}
.skr.dis{border-left-color:#8a5cd6}.skr.int{border-left-color:#c9a227}.skr.av{border-left-color:#3f8fcf}.skr.add{border-left-color:#c46a2a}
.skr.mine{background:rgba(90,160,80,.1);border-color:#4f7a3c;border-left-color:#8a5cd6}
.skr .mi{display:inline-flex;align-items:center;gap:2px;margin-left:5px;font-size:10px;font-weight:800;color:#7bea7b;border:1px solid #4f7a3c;border-radius:5px;padding:0 4px;vertical-align:1px}.skr .mi img{width:12px;height:12px}


/* 줄 맞춤 */
.tags{align-items:center}.tags span{height:22px;box-sizing:border-box;line-height:1;padding:0 8px 0 3px;vertical-align:middle}
.tags .ic{width:16px;height:16px;flex:none;display:block}
.tags .k:not(:has(.ic)){padding-left:8px}
.lgd{align-items:center}.lgd span{height:20px;box-sizing:border-box;display:inline-flex;align-items:center;line-height:1;padding:0 8px}
.skr{min-height:44px;box-sizing:border-box}.skr .ic{width:28px;height:28px;display:block}
.skr .m b{display:inline-flex;align-items:center;gap:5px;line-height:1.2}
.skr .mi{margin-left:6px;height:16px;box-sizing:border-box;vertical-align:middle}
.skr .k{min-width:40px;height:20px;box-sizing:border-box;display:inline-flex;align-items:center;justify-content:center;line-height:1}
.dzb{align-items:center}.dzb .ic{display:block}
.obj{align-items:center}
