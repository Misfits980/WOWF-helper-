name: 연동 저장소 점검
on:
  push:
    paths: ['.github/workflows/cors-check.yml']
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          ID=wfh-test-$RANDOM$RANDOM
          {
          echo "== textdb OPTIONS"; curl -s -i -X OPTIONS -H "Origin: https://misfits980.github.io" -H "Access-Control-Request-Method: POST" -H "Access-Control-Request-Headers: content-type" https://textdb.dev/api/data/$ID | head -20
          echo "== textdb POST"; curl -s -i -X POST -H "Origin: https://misfits980.github.io" -H "Content-Type: text/plain" -d 'hello123' https://textdb.dev/api/data/$ID | head -20
          echo "== textdb GET"; curl -s -i -H "Origin: https://misfits980.github.io" https://textdb.dev/api/data/$ID | head -20
          echo "== jsonblob POST browser UA"; curl -s -i -X POST -A "Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.0 Mobile/15E148 Safari/604.1" -H "Origin: https://misfits980.github.io" -H "Content-Type: application/json" -H "Accept: application/json" -d '{"t":1}' https://jsonblob.com/api/jsonBlob | head -25
          } > data/cors-check.txt 2>&1
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cors-check.txt && git commit -m "연동 저장소 점검 결과" && git pull --rebase && git push
