name: 연동 저장소 점검
on:
  push:
    paths: ['.github/workflows/cors-check.yml']
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          ID=wfh-sizetest-$RANDOM$RANDOM
          head -c 300000 /dev/urandom | base64 -w0 > /tmp/big.txt
          {
          echo "sent $(wc -c < /tmp/big.txt)"
          curl -s -o /dev/null -w "POST %{http_code}\n" -X POST -H "Content-Type: text/plain" --data-binary @/tmp/big.txt https://textdb.dev/api/data/$ID
          echo "got $(curl -s https://textdb.dev/api/data/$ID | wc -c)"
          curl -s -o /dev/null -w "POST2 %{http_code}\n" -X POST -H "Content-Type: text/plain" --data-binary 'x' https://textdb.dev/api/data/$ID
          } > data/cors-check.txt 2>&1
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cors-check.txt && git commit -m "연동 저장소 점검 결과" && git pull --rebase && git push
