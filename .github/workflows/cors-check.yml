name: 연동 저장소 점검
on:
  push:
    paths: ['.github/workflows/cors-check.yml']
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          {
          echo "== OPTIONS"; curl -s -i -X OPTIONS -H "Origin: https://misfits980.github.io" -H "Access-Control-Request-Method: POST" -H "Access-Control-Request-Headers: content-type" https://jsonblob.com/api/jsonBlob | head -30
          echo "== POST"; curl -s -i -X POST -H "Origin: https://misfits980.github.io" -H "Content-Type: application/json" -H "Accept: application/json" -d '{"t":1}' https://jsonblob.com/api/jsonBlob | head -30
          } > data/cors-check.txt 2>&1
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cors-check.txt && git commit -m "연동 저장소 점검 결과" && git pull --rebase && git push
