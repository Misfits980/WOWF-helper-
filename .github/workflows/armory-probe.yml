name: 전투정보실 시험
on:
  workflow_dispatch:
  push:
    paths: ['tools/armory-probe.mjs']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node tools/armory-probe.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/armory
          git diff --cached --quiet || (git commit -m "전투정보실 시험 결과" && git pull --rebase && git push)
