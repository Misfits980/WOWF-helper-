name: 전투정보실 불러오기
on:
  workflow_dispatch:
  schedule:
    - cron: '*/20 * * * *'   # 20분마다
    - cron: '2 15 * * *'     # 한국 밤 12시 2분
  push:
    paths: ['data/armory/chars.txt', 'tools/armory-sync.mjs']
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node tools/armory-sync.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/armory
          git diff --cached --quiet || (git commit -m "전투정보실 갱신" && git pull --rebase && git push)
