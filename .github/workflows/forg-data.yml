name: forg 자료 가져오기
on:
  workflow_dispatch:
  push:
    paths: ['tools/forg-scrape.mjs', '.github/workflows/forg-data.yml']
permissions:
  contents: write
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node tools/forg-scrape.mjs
      - name: 자료 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/forg
          git diff --cached --quiet || (git commit -m "forg 자료 갱신" && git push)
