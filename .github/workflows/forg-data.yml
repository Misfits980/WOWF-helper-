name: forg 자료 가져오기
on:
  workflow_dispatch:
  push:
    paths: ['tools/**', '.github/workflows/forg-data.yml']
concurrency:
  group: forg-data
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node tools/forg-scrape.mjs
      - run: node tools/forg-classes.mjs
      - run: node tools/forg-weights.mjs
        continue-on-error: true
      - run: node tools/forg-leveling.mjs
      - run: node tools/forg-quests.mjs
        timeout-minutes: 60
      - run: node tools/quest-wowf.mjs
        timeout-minutes: 40
      - run: node tools/quest-rewards.mjs
        timeout-minutes: 40
      - run: node tools/wythic-bosses.mjs
        continue-on-error: true
      - run: node tools/dungeon-guide.mjs
        timeout-minutes: 15
        continue-on-error: true
      - name: QuestieDB(포에버 퀘스트 자료) 받기
        run: |
          git clone -q --depth 1 --filter=blob:none --sparse https://github.com/Questie/QuestieDB /tmp/qdb
          git -C /tmp/qdb sparse-checkout set data/Forever l10n/Forever src/corrections/enum src/corrections/Forever support/Forever/Zones
          git clone -q --depth 1 --filter=blob:none --sparse https://github.com/Questie/Questie /tmp/qz
          git -C /tmp/qz sparse-checkout set Localization/Translations/Zones Localization/lookups
      - run: python3 tools/qdb/import.py /tmp/qdb /tmp/qz
      - run: node tools/qdb-ko-wowf.mjs
        timeout-minutes: 45
        continue-on-error: true
      - run: python3 tools/qdb/import.py /tmp/qdb /tmp/qz
      - run: python3 tools/apply-quest-places.py
      - name: 클래식 장비 자료로 장비 더하기
        run: |
          git clone -q --depth 1 --filter=blob:none --sparse https://github.com/nexus-devs/wow-classic-items /tmp/nx
          git -C /tmp/nx sparse-checkout set data/json
          python3 tools/items-extra.py /tmp/nx/data/json/data.json
        continue-on-error: true
      - run: node tools/items-wowf.mjs
        timeout-minutes: 45
        continue-on-error: true
      - run: python3 app/build.py
      - run: python3 tools/data-check.py
        continue-on-error: true
      - name: 자료 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 자료만 먼저 커밋 → 빌드 결과 등 나머지 변경은 버리고 최신 코드 위에 올린 뒤 다시 빌드
          git add data/forg data/qdb data/check-report.json
          if git diff --cached --quiet; then echo "바뀐 자료 없음"; exit 0; fi
          git commit -m "forg 자료 갱신"
          git reset --hard -q HEAD && git clean -fdq
          git pull --rebase -X theirs
          python3 app/build.py
          git add index.html app-data.js addon
          git diff --cached --quiet || git commit -m "rebuild"
          git push
