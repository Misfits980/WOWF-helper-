name: 페이지 모양 확인 (한 번만)
on:
  push:
    paths: ['.github/workflows/probe.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p data/probe2
          UA='WOWF-helper data sync (github.com/Misfits980/WOWF-helper-)'
          for c in $(grep -o 'src="/_next/static/chunks/[^"]*"' data/probe/forg_gg_forever_gear_rogue_spec_combat_lv_60_phase_pre.html | sed 's/src="//;s/"$//' | sort -u); do
            curl -sL -A "$UA" -o /tmp/c.js "https://forg.gg$c" || continue
            if grep -q 'dpsMain\|wowsims\|"crit"' /tmp/c.js; then n=$(basename "${c%%\?*}"); cp /tmp/c.js "data/probe2/$n.txt"; echo "keep $n $(wc -c < /tmp/c.js)"; fi
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/probe2 && git commit -m "시험 자료" && git pull --rebase -X theirs && git push
