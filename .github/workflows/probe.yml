name: 페이지 모양 확인 (한 번만)
on:
  push:
    paths: ['.github/workflows/probe.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p data/probe
          UA='WOWF-helper data sync (github.com/Misfits980/WOWF-helper-)'
          for u in "https://forg.gg/forever/gear/rogue?spec=combat&lv=60&phase=pre" "https://forg.gg/forever/gear/rogue?spec=combat&lv=40&phase=pre" "https://forg.gg/forever/gear/priest?spec=holy&lv=60&phase=pre" ; do
            f=$(echo "$u" | sed 's#https://##; s#[/.?&=]#_#g')
            curl -sL -A "$UA" -H 'accept-language: ko' -o "data/probe/$f.html" -w "$u %{http_code} %{size_download}\n" "$u" || true
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/probe && git commit -m "시험 페이지" && git pull --rebase -X theirs && git push
