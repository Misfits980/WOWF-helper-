name: wythic 던전 공략·전문기술 불러오기
on:
  workflow_dispatch:
  schedule:
    - cron: '17 18 * * *'   # 매일 새벽 3시 17분(한국) — 새 던전 공략이 계속 채워지는 중이라 매일
  push:
    paths: ['tools/wythic-dungeons.mjs', 'tools/wythic-profs.mjs', '.github/workflows/wythic.yml']
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node tools/wythic-dungeons.mjs
      - run: node tools/wythic-profs.mjs
      # 새 던전 진행 순서는 빌드 때 wythic 자료로 만들어지니(app/build.py _dg_extra), 자료가 바뀌면 최신 main 위에서 다시 빌드
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/wythic
          git diff --cached --quiet && exit 0
          git commit -qm "wythic 던전 공략 갱신"
          git pull -q --rebase
          python3 app/build.py
          git add data/forg/dungeon-guide.json index.html app-data.js addon/WowfHelper/BossTips.lua
          git diff --cached --quiet || git commit -qm "wythic 반영 다시 빌드"
          git push
