name: tmp-check
on:
  push:
    paths: ['.github/workflows/tmp-check.yml']
jobs:
  c:
    runs-on: ubuntu-latest
    steps:
      - name: quest tooltip probe
        run: |
          for q in 349 5634 95041 2238 93828; do echo "### $q"; curl -s --max-time 20 "https://nether.wowhead.com/forever/tooltip/quest/$q?locale=1" | head -c 1500; echo; sleep 2; done
          echo "### npc"; curl -s "https://nether.wowhead.com/forever/tooltip/npc/1?locale=1" | head -c 200
