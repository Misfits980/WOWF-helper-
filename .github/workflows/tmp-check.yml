name: tmp-check
on: { push: { paths: ['.github/workflows/tmp-check.yml'] } }
permissions: { contents: write }
jobs:
  maps:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir out && cd out
          for id in 1 3 4 8 10 11 12 15 16 17 28 33 36 38 40 44 45 46 47 51 139 141 148 267 331 357 361 400 405 406 440 490 493 618 1377; do curl -sf -A 'Mozilla/5.0' -o "$id.jpg" "https://wow.zamimg.com/images/wow/classic/maps/kokr/original/$id.jpg" && echo "ok $id $(stat -c%s $id.jpg)"; sleep 1; done
          git init -q && git checkout -q -b tmp-shots && git add . && git -c user.name=bot -c user.email=bot@x commit -qm maps
          git push -qf https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git tmp-shots
