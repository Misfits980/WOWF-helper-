name: tmp-check
on:
  push:
    paths: ['.github/workflows/tmp-check.yml']
jobs:
  c:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: urls
        run: |
          cat tools/tmp-urls.txt | xargs -P 8 -I{} sh -c 'r=$(curl -s -o /dev/null -L --max-time 20 -A "Mozilla/5.0" -w "%{http_code} %{size_download}" "{}"); echo "$r {}"' > res.txt
          echo "== 상태"; cut -d' ' -f1 res.txt | sort | uniq -c
          echo "== 실패"; grep -v '^200 ' res.txt | head -100
          echo "== wythic"; grep wythic res.txt
