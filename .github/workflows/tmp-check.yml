name: tmp-check
on: { push: { paths: ['.github/workflows/tmp-check.yml'] } }
permissions: { contents: write }
jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - run: |
          git init -q && git push -q https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git --delete tmp-shots || true
