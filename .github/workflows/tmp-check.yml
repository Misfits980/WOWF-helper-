name: tmp-check
on: { push: { paths: ['.github/workflows/tmp-check.yml','.github/tmp_shot.py'] } }
permissions: { contents: write }
jobs:
  shot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install playwright
      - run: |
          true
      - run: python3 .github/tmp_shot.py
      - run: |
          cd shots && git init -q && git checkout -q -b tmp-shots && git add . && git -c user.name=bot -c user.email=bot@x commit -qm shots
          git push -qf https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git tmp-shots
